# aaPanel / nginx reference for console.labyrinthscout.com
# Public hub at / ; operator dashboard at /dashboard (HTTP Basic Auth).

server {
    listen 80;
    server_name console.labyrinthscout.com;
    location /.well-known/acme-challenge/ { allow all; }
    location / { return 301 https://console.labyrinthscout.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name console.labyrinthscout.com;
    # ssl_certificate / ssl_certificate_key: set in production (Let's Encrypt)

    location /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
    }

    # Carina agents + public trust API (keyed or public)
    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:4444;
        include proxy_params.conf;
    }

    # Customer account portal: session login only
    location /account {
        auth_basic off;
        proxy_pass http://127.0.0.1:4444;
        include proxy_params.conf;
    }

    # Public pricing page
    location /pricing {
        auth_basic off;
        proxy_pass http://127.0.0.1:4444;
        include proxy_params.conf;
    }

    # Operator security console (embeds SCOUT_API_KEY)
    location /dashboard {
        auth_basic "Labyrinth Scout Operator";
        auth_basic_user_file /etc/nginx/.htpasswd-console-labyrinthscout;
        proxy_pass http://127.0.0.1:4444;
        include proxy_params.conf;
    }

    # Landing hub, static assets, favicon (no Basic Auth)
    location / {
        auth_basic off;
        proxy_pass http://127.0.0.1:4444;
        include proxy_params.conf;
    }
}

# If your host has no proxy_params.conf, use these headers on each location:
