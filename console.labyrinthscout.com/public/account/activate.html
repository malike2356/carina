<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Activate Scout account</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="/hub.css?v=4">
<link rel="stylesheet" href="/account/account.css?v=4">
</head>
<body>
  <header class="auth-top">
    <nav class="hub-nav" aria-label="Console navigation">
      <a class="hub-brand" href="/">LABYRINTH SCOUT</a>
      <div class="hub-nav-links">
        <a href="/">Home</a>
        <a href="/pricing">Pricing</a>
        <a href="/docs/">Docs</a>
        <a href="https://carinaai.uk">Carina</a>
        <a href="https://carinaai.uk/trust">Trust</a>
        <a href="/account/login">Sign in</a>
        <a href="https://core.carinaai.uk/checkout?plan=scout_pro">Get Scout Pro</a>
      </div>
    </nav>
  </header>
  <div class="auth-shell auth-shell-below-nav">
    <main class="auth-card">
      <div class="auth-brand">
        <div class="auth-logo"><i class="ti ti-shield-lock"></i></div>
        <div>
          <h1>Activate your account</h1>
        </div>
      </div>
      <p class="sub">Choose a password for your Scout console. No .env editing required; Carina Cloud pairs automatically after checkout so the workspace and the security layer stay in sync.</p>
      <form id="activate-form">
        <label class="field-label" for="password">Password</label>
        <input class="field-input" type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
        <label class="field-label" for="password2">Confirm password</label>
        <input class="field-input" type="password" id="password2" name="password2" required minlength="8" autocomplete="new-password">
        <p id="error" class="error" hidden></p>
        <button class="btn-primary" type="submit" id="submit-btn">Activate and continue</button>
      </form>
      <p class="alt">Already activated? <a href="/account/login">Sign in</a></p>
    </main>
  </div>
  <script src="/account/account.js?v=3"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    if (!token) {
      document.getElementById('error').textContent = 'Missing setup token. Open the link from your welcome email.';
      document.getElementById('error').hidden = false;
      document.getElementById('submit-btn').disabled = true;
    }

    document.getElementById('activate-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const error = document.getElementById('error');
      const btn = document.getElementById('submit-btn');
      const password = document.getElementById('password').value;
      const password2 = document.getElementById('password2').value;
      error.hidden = true;
      if (password !== password2) {
        error.textContent = 'Passwords do not match';
        error.hidden = false;
        return;
      }
      btn.disabled = true;

      const { res, data } = await apiFetch('/account/activate', {
        method: 'POST',
        body: JSON.stringify({ token, password }),
      });

      btn.disabled = false;
      if (!res.ok) {
        error.textContent = data.error || 'Activation failed';
        error.hidden = false;
        return;
      }
      window.location.href = '/account';
    });
  </script>
</body>
</html>
