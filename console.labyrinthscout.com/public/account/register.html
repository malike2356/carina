<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create account - Labyrinth Scout</title>
<link rel="stylesheet" href="/account/account.css">
</head>
<body>
  <main class="auth-card">
    <h1>Labyrinth Scout</h1>
    <p class="sub">Create an account to pair your Carina with Scout</p>
    <form id="register-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="8">
      <p class="hint">At least 8 characters</p>
      <p id="error" class="error" hidden></p>
      <button type="submit">Create account</button>
    </form>
    <p class="alt">Already have an account? <a href="/account/login">Sign in</a></p>
  </main>
  <script>
    const form = document.getElementById('register-form');
    const error = document.getElementById('error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      error.hidden = true;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/account/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        error.textContent = data.error || 'Could not create account';
        error.hidden = false;
        return;
      }
      window.location.href = '/account';
    });
  </script>
</body>
</html>
