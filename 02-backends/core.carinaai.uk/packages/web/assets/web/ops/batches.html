<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carina Ops - Batches</title>
  <link rel="stylesheet" href="/ops/assets/ops.css">
</head>
<body>
  <div class="wrap">
    <div class="ops-header"><div><h1>Carina Ops</h1><p class="ops-sub"><span id="org-name">Organization</span></p></div><span class="plan-badge" id="plan-badge"></span></div>
    <nav class="ops-nav" id="ops-nav"></nav>
    <div class="card">
      <h2>Batches</h2>
      <p style="margin-bottom:12px;">Queue batch jobs locally. Status updates when upstream batch runners are connected.</p>
      <table class="ops-table">
        <thead><tr><th>Name</th><th>Status</th><th>Inputs</th><th>Outputs</th><th>Created</th></tr></thead>
        <tbody id="batches-body"><tr><td colspan="5" class="placeholder">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="card">
      <h2>Create batch</h2>
      <form id="batch-form">
        <div class="form-row"><label for="batch-name">Name</label><input type="text" id="batch-name" name="name" required></div>
        <div class="form-row"><label for="batch-count">Input count</label><input type="text" id="batch-count" name="inputCount" value="1"></div>
        <button class="btn" type="submit">Queue batch</button>
        <p class="error-msg" id="batch-error" hidden></p>
      </form>
    </div>
  </div>
  <script src="/ops/assets/layout.js"></script>
  <script src="/ops/assets/platform-page.js"></script>
  <script>
    async function loadBatches() {
      const { ok, data } = await CarinaPlatform.fetchJson('/api/carina-ops/batches');
      if (!ok) {
        CarinaPlatform.renderTable('batches-body', [], [], 'Unable to load batches.');
        return;
      }
      CarinaPlatform.renderTable('batches-body', [
        { key: 'name' },
        { key: 'status' },
        { key: 'batchInputCount' },
        { key: 'batchOutputCount' },
        { key: 'createdAt', render: (row) => row.createdAt ? new Date(row.createdAt).toLocaleString() : '-' },
      ], data.batches || [], 'No batches queued yet.');
    }

    CarinaOpsLayout.initPage('batches', {
      onReady: async () => {
        await loadBatches();
        CarinaPlatform.bindCreateForm('batch-form', async (formData) => {
          CarinaPlatform.showError('batch-error', '');
          const { ok, data } = await CarinaPlatform.fetchJson('/api/carina-ops/batches', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: String(formData.get('name') || '').trim(),
              inputCount: Number(formData.get('inputCount') || 1),
            }),
          });
          if (!ok) {
            CarinaPlatform.showError('batch-error', data.error || 'Unable to create batch.');
            return;
          }
          document.getElementById('batch-form').reset();
          await loadBatches();
        });
      },
    });
  </script>
</body>
</html>
