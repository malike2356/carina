<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Documents; Carina</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface-2: #141720;
    --border: #2a2d3a; --text: #e4e6f0; --muted: #8890a8;
    --accent: #6c8cff; --danger: #ff4d6a; --success: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  .top-nav {
    display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .top-nav a { color: var(--accent); text-decoration: none; font-size: 0.875rem; }
  .top-nav h1 { font-size: 1rem; font-weight: 600; }
  .layout { flex: 1; display: grid; grid-template-columns: 240px 1fr; min-height: 0; }
  .sidebar {
    border-right: 1px solid var(--border); background: var(--surface-2);
    display: flex; flex-direction: column; min-height: 0;
  }
  .sidebar-head { padding: 0.75rem; border-bottom: 1px solid var(--border); }
  .doc-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
  .doc-item {
    padding: 0.6rem 0.75rem; border-radius: 8px; cursor: pointer; margin-bottom: 0.25rem;
    border: 1px solid transparent;
  }
  .doc-item:hover { background: var(--surface); }
  .doc-item.active { background: var(--surface); border-color: var(--border); }
  .doc-item .title { font-size: 0.85rem; font-weight: 600; }
  .doc-item .meta { font-size: 0.7rem; color: var(--muted); margin-top: 0.15rem; }
  .badge {
    display: inline-block; font-size: 0.65rem; text-transform: uppercase;
    padding: 0.1rem 0.35rem; border-radius: 4px; background: rgba(108,140,255,0.15); color: var(--accent);
  }
  .main { display: flex; flex-direction: column; min-height: 0; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
    padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .toolbar input, .toolbar select, .toolbar button {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.8rem;
  }
  .toolbar button { cursor: pointer; }
  .toolbar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbar .spacer { flex: 1; }
  .editor-wrap { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; }
  .editor-wrap.split { grid-template-columns: 1fr 1fr; }
  .editor-pane, .preview-pane { min-height: 0; display: flex; flex-direction: column; }
  .preview-pane { border-left: 1px solid var(--border); background: var(--surface-2); }
  .pane-label {
    font-size: 0.7rem; text-transform: uppercase; color: var(--muted);
    padding: 0.35rem 0.75rem; border-bottom: 1px solid var(--border);
  }
  #editor {
    flex: 1; width: 100%; resize: none; border: 0; outline: none;
    background: var(--bg); color: var(--text); padding: 0.75rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85rem; line-height: 1.5;
  }
  #preview {
    flex: 1; overflow-y: auto; padding: 0.75rem; font-size: 0.9rem; line-height: 1.6;
  }
  #preview pre { background: #1e1e2e; padding: 0.75rem; border-radius: 8px; overflow-x: auto; }
  .assist-panel {
    border-top: 1px solid var(--border); background: var(--surface);
    padding: 0.75rem; display: none;
  }
  .assist-panel.open { display: block; }
  .assist-panel textarea {
    width: 100%; min-height: 64px; resize: vertical; margin-top: 0.35rem;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.5rem; font-size: 0.85rem;
  }
  .assist-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
  .assist-actions button {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.4rem 0.65rem; font-size: 0.8rem; cursor: pointer;
  }
  .assist-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .diff-preview {
    margin-top: 0.6rem; padding: 0.6rem; border-radius: 8px;
    background: var(--surface-2); border: 1px solid var(--border); font-size: 0.82rem;
    white-space: pre-wrap; max-height: 180px; overflow-y: auto;
  }
  .empty-main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 0.9rem;
  }
  .status { font-size: 0.75rem; color: var(--muted); }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { max-height: 180px; }
    .editor-wrap.split { grid-template-columns: 1fr; }
    .preview-pane { border-left: 0; border-top: 1px solid var(--border); min-height: 200px; }
  }
</style>
</head>
<body>
<!--CARINA_WORKSPACE_BEGIN-->
<header class="ws-page-header">
  <h1>Documents</h1>
  <span class="status" id="save-status"></span>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-head">
      <button class="primary" id="new-doc" type="button" style="width:100%;">+ New</button>
    </div>
    <div class="doc-list" id="doc-list"></div>
  </aside>
  <section class="main" id="main-panel">
    <div class="empty-main" id="empty-state">Select a document or create a new one.</div>
    <div id="editor-panel" hidden>
      <div class="toolbar">
        <input type="text" id="doc-title" placeholder="Title" style="min-width:180px;">
        <select id="doc-format">
          <option value="markdown">Markdown</option>
          <option value="html">HTML</option>
          <option value="csv">CSV</option>
          <option value="plain">Plain</option>
        </select>
        <span class="status" id="word-count">0 words</span>
        <button type="button" id="toggle-preview">Preview</button>
        <button type="button" id="toggle-assist">AI Assist</button>
        <span class="spacer"></span>
        <button type="button" id="save-doc" class="primary">Save</button>
        <button type="button" id="export-doc">Export</button>
        <button type="button" id="delete-doc" style="color:var(--danger);">Delete</button>
      </div>
      <div class="editor-wrap" id="editor-wrap">
        <div class="editor-pane">
          <div class="pane-label">Editor</div>
          <textarea id="editor" spellcheck="true"></textarea>
        </div>
        <div class="preview-pane" id="preview-pane" hidden>
          <div class="pane-label">Preview</div>
          <div id="preview"></div>
        </div>
      </div>
      <div class="assist-panel" id="assist-panel">
        <label for="assist-instruction" style="font-size:0.8rem;color:var(--muted);">Instruction</label>
        <textarea id="assist-instruction" placeholder="e.g. Improve this paragraph's clarity"></textarea>
        <div class="assist-actions">
          <button type="button" id="assist-selection" class="primary">Apply to selection</button>
          <button type="button" id="assist-full">Apply to full document</button>
          <button type="button" id="assist-accept" hidden>Accept</button>
          <button type="button" id="assist-discard" hidden>Discard</button>
        </div>
        <div class="diff-preview" id="assist-preview" hidden></div>
      </div>
    </div>
  </section>
</div>
<!--CARINA_WORKSPACE_END-->
<script src="/documents.js"></script>
</body>
</html>
