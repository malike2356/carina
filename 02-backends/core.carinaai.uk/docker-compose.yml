services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./laravel:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel
      - python-api
    networks:
      - carina

  laravel:
    build:
      context: .
      dockerfile: docker/Dockerfile.laravel
    volumes:
      - ./laravel:/var/www/html
      - laravel-storage:/var/www/html/storage
    env_file: ./laravel/.env
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-local}
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - carina

  python-api:
    build:
      context: ./python
      dockerfile: Dockerfile
    volumes:
      - ./python:/app
    env_file: ./laravel/.env
    environment:
      PYTHONUNBUFFERED: "1"
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-local}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - carina

  celery:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: celery -A tasks worker --concurrency=2 --loglevel=info
    volumes:
      - ./python:/app
    env_file: ./laravel/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-local}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-dev-redis-local}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-dev-redis-local}@redis:6379/2
    depends_on:
      - redis
      - postgres
    networks:
      - carina

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: ${DB_USERNAME:-carina}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_DATABASE:-carina_central}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-carina}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - carina

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-local}
    volumes:
      - redisdata:/data
      - ./docker/redis/dev-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint.sh"]
    # Local dev only: bind to host loopback. Do not expose 6379 in production.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-redis-local}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - carina

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888
    volumes:
      - ./docker/searxng:/etc/searxng
    restart: unless-stopped
    networks:
      - carina

  meilisearch:
    image: getmeili/meilisearch:v1.11
    ports:
      - "7701:7700"
    volumes:
      - meilidata:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY:-masterkey}
      MEILI_ENV: development
    networks:
      - carina

volumes:
  pgdata:
  redisdata:
  meilidata:
  laravel-storage:

networks:
  carina:
    driver: bridge
