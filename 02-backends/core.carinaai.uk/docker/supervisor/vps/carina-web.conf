; Carina web gateway (optional split deployment)
;
; Lightweight HTTP gateway only. Use when carina-core runs elsewhere and you need
; a dedicated web front-end process. Default production runs web inside carina-core.
;
; Copy to /etc/supervisor/conf.d/carina-web.conf on the VPS when needed, then:
; sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start carina-web

[program:carina-web]
command=/usr/bin/node /home/malike/apps/core.carinaai.uk/dist/bin/carina.js serve
directory=/home/malike/apps/core.carinaai.uk
user=malike
autostart=false
autorestart=true
priority=30
stopwaitsecs=30
stdout_logfile=/home/malike/logs/carina-web.out.log
stderr_logfile=/home/malike/logs/carina-web.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=NODE_ENV="production",WEB_ENABLED="true",WEB_PORT="3000",SKIP_CLI="true"
