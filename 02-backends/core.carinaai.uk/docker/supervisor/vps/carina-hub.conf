; Skills Hub (hub.carinaai.uk)
; Copy to /etc/supervisor/conf.d/carina-hub.conf on the VPS, then:
; sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start carina-hub
;
; Replace placeholder values below, or rely on /home/malike/apps/core.carinaai.uk/.env
; (Carina loads .env from the app directory in production).

[program:carina-hub]
command=/usr/bin/node /home/malike/apps/core.carinaai.uk/dist/src/skills/hub/server.js
directory=/home/malike/apps/core.carinaai.uk
user=malike
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/home/malike/logs/carina-hub.out.log
stderr_logfile=/home/malike/logs/carina-hub.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=NODE_ENV="production",SKILLS_HUB_PORT="3001"
