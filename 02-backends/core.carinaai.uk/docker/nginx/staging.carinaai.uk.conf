# Staging nginx (same Docker nginx as production).
# POST-GTM: IP allowlist off for GTM launch (NGINX_STAGING_IP_ALLOWLIST=false in docker/config/gtm-rollout.json).
#
# Resolver lives in conf.d/security-defaults.conf (shared with admin.carinaai.uk).

server {
  listen 443 ssl;
  http2 on;
  server_name staging.core.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  include /etc/nginx/conf.d/security-headers.inc;

  location / {
    set $staging_web carina-staging-web:3000;
    proxy_pass         http://$staging_web;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_read_timeout 300s;
  }
}

