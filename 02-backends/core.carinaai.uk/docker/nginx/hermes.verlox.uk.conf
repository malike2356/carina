server {
  listen 80;
  server_name hermes.verlox.uk;

  include /etc/nginx/certbot-location.inc;

  return 301 https://hermes.verlox.uk$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name hermes.verlox.uk;

  ssl_certificate     /etc/nginx/ssl/live/verlox.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/verlox.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  client_max_body_size 32m;

  location / {
    proxy_pass http://unix:/run/hermes/hermes.sock:;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
