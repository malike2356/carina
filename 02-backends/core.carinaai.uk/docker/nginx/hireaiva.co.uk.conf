}

server {
  listen 443 ssl;
  http2 on;
  server_name hireaiva.co.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  root /var/www/hireaiva.co.uk;
  index index.html;

  location /register {
    return 301 https://admin.hireaiva.co.uk$request_uri;
  }

  location /billing {
    return 301 https://admin.hireaiva.co.uk$request_uri;
  }

  # Kill any legacy marketing service worker that may cache empty policy pages.
  location = /sw.js {
    default_type application/javascript;
    charset utf-8;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Service-Worker-Allowed "/" always;
    return 200 'self.addEventListener("install",function(){self.skipWaiting()});self.addEventListener("activate",function(e){e.waitUntil(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).then(function(){return self.clients.claim()}))});';
  }

  location ~* \.(html)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    try_files $uri =404;
  }

  location / {
    # Prefer directory index; do not fall back to homepage for missing policy pages.
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}

# aiva2 Hermes dashboard (admin.hireaiva.co.uk). See aiva2/docker-compose.contabo.yml.
upstream aiva2_dashboard {
  zone aiva2_dashboard 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server aiva2-dashboard:9129 resolve;
}

# Aiva Ops back-office (ops.hireaiva.co.uk). See aiva2/ops/docker-compose.contabo.yml.
upstream aiva_ops {
  zone aiva_ops 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server aiva-ops:4100 resolve;
}

server {
  listen 443 ssl;
  http2 on;
  server_name admin.hireaiva.co.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  # SPSS/CSV Aiva chat uploads allow up to 40MB on core; keep nginx above that.
  client_max_body_size 45M;
  proxy_read_timeout  300s;
  proxy_send_timeout  300s;

  # Legacy PWA service workers break Aiva auth (RSC fetch errors). Serve a kill script
  # from nginx (not Cloudflare-cached app static). Do NOT call registration.unregister()
  # inside activate; that races browser update() and throws InvalidStateError.
  # Keep in sync with app.carinaai.uk/src/lib/aiva-sw-kill.ts
  location = /sw.js {
    default_type application/javascript;
    charset utf-8;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options nosniff always;
    return 200 'self.addEventListener("install",function(){self.skipWaiting()});self.addEventListener("activate",function(e){e.waitUntil(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).then(function(){return self.clients.claim()}))});';
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    charset utf-8;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 200 '{"name":"Aiva","short_name":"Aiva","display":"browser","start_url":"/","scope":"/"}';
  }

  # Internal upstream to carina_cloud. Never proxy_pass https://aiva.carinaai.uk;
  # that hostname resolves to Cloudflare and loops back to this nginx (520).
  location = /propreneur-panel.js {
    proxy_pass         http://carina_web/api/aiva/propreneur/panel.js;
    proxy_http_version 1.1;
    proxy_set_header   Host core.carinaai.uk;
    add_header         Cache-Control "no-store";
  }

  location ~ ^/aiva/workers/[0-9a-f-]+$ {
    proxy_pass         http://carina_cloud;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Accept-Encoding   "";
    proxy_buffering    on;
    sub_filter_once    on;
    sub_filter         '</body>' '<script defer src="/propreneur-panel.js"></script></body>';
  }

  # Ask Carina streams SSE; buffering + Connection upgrade on / breaks it (502).
  location /api/karina/ {
    proxy_pass         http://carina_cloud;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";
    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout  300s;
    chunked_transfer_encoding on;
  }

  # Hermes SPA + API (aiva2-dashboard). Do not proxy the main app through
  # carina_cloud: that stack adds a second Content-Security-Policy without
  # fonts.googleapis.com, which blocks theme font injection even when nginx
  # allowlists Google Fonts.
  location / {
    proxy_pass         http://aiva2_dashboard;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_cache        off;
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
  # CSP is set once by aiva2-dashboard middleware (includes Google Fonts).
}

server {
  listen 443 ssl;
  http2 on;
  server_name ops.hireaiva.co.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  client_max_body_size 20M;
  proxy_read_timeout  120s;
  proxy_send_timeout  120s;

  location / {
    proxy_pass         http://aiva_ops;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_cache        off;
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}
