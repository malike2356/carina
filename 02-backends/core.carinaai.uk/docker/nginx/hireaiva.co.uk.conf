server {
  listen 80;
  server_name hireaiva.co.uk www.hireaiva.co.uk hireaiva.uk www.hireaiva.uk;

  include /etc/nginx/certbot-location.inc;

  location / {
    return 301 https://hireaiva.co.uk$request_uri;
  }
}

server {
  listen 80;
  server_name admin.hireaiva.co.uk;

  include /etc/nginx/certbot-location.inc;

  location / {
    return 301 https://admin.hireaiva.co.uk$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name hireaiva.uk www.hireaiva.uk www.hireaiva.co.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  return 301 https://hireaiva.co.uk$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name hireaiva.co.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  root /var/www/hireaiva.co.uk;
  index index.html;

  location /register {
    return 301 https://admin.hireaiva.co.uk$request_uri;
  }

  location /billing {
    return 301 https://admin.hireaiva.co.uk$request_uri;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}

server {
  listen 443 ssl;
  http2 on;
  server_name admin.hireaiva.co.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  client_max_body_size 10M;
  proxy_read_timeout  300s;
  proxy_send_timeout  300s;

  # Legacy PWA service workers break Aiva auth (RSC fetch errors). Serve a one-shot
  # kill script from nginx with no-cache so Cloudflare cannot serve a stale worker.
  location = /sw.js {
    default_type application/javascript;
    charset utf-8;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    return 200 'self.addEventListener("install",function(e){e.waitUntil(self.skipWaiting())});self.addEventListener("activate",function(e){e.waitUntil(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).then(function(){return self.registration.unregister()}))});';
  }

  # Internal upstream to carina_cloud. Never proxy_pass https://aiva.carinaai.uk;
  # that hostname resolves to Cloudflare and loops back to this nginx (520).
  location / {
    proxy_pass         http://carina_cloud;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_cache        off;
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}
