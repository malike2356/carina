# Clinicom AI on the shared Carina nginx origin.
# This keeps clinicomai.com and ops.clinicomai.com reachable through the
# public nginx container instead of falling into the default 444 host block.

server {
  listen 80;
  server_name clinicomai.com *.clinicomai.com;

  include /etc/nginx/certbot-location.inc;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.clinicomai.com;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  return 301 https://clinicomai.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ops.clinicomai.com;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  client_max_body_size 8m;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $clinicom_ops_upstream clinicom-ops:8610;
    proxy_pass http://$clinicom_ops_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
  add_header X-Robots-Tag           "noindex, nofollow";
}

server {
  listen 443 ssl;
  http2 on;
  server_name clinicomai.com *.clinicomai.com;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  client_max_body_size 32m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  location / {
    proxy_pass http://clinicom-app:8600;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}
