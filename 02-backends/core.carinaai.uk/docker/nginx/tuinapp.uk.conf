# TuinApp (tuinapp.uk) via Docker nginx -> tuinapp_app:3000 on the proxy network.
# TuinApp compose must attach container tuinapp_app to external network "proxy".
# Issue TLS once: certbot certonly --webroot -w /var/www/certbot -d tuinapp.uk -d www.tuinapp.uk

upstream tuinapp_web {
  server tuinapp_app:3000;
}

# HTTP: apex + www -> HTTPS apex (ACME via certbot-location.inc)
server {
  listen 80;
  server_name tuinapp.uk www.tuinapp.uk;

  include /etc/nginx/certbot-location.inc;

  return 301 https://tuinapp.uk$request_uri;
}

# HTTP: tenant + platform subdomains -> HTTPS (same host)
server {
  listen 80;
  server_name ~^(?<subdomain>[^.]+)\.tuinapp\.uk$;

  include /etc/nginx/certbot-location.inc;

  return 301 https://$host$request_uri;
}

# HTTPS: www -> apex
server {
  listen 443 ssl;
  http2 on;
  server_name www.tuinapp.uk;

  ssl_certificate     /etc/nginx/ssl/live/tuinapp.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/tuinapp.uk/privkey.pem;
  include             /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  return 301 https://tuinapp.uk$request_uri;
}

# HTTPS: apex (marketing / workspaces hub)
server {
  listen 443 ssl;
  http2 on;
  server_name tuinapp.uk;

  ssl_certificate     /etc/nginx/ssl/live/tuinapp.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/tuinapp.uk/privkey.pem;
  include             /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  client_max_body_size 64m;

  location / {
    proxy_pass         http://tuinapp_web;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;
  }
}

# HTTPS: *.tuinapp.uk (admin, app, tenant workspaces, docs, status, ...)
server {
  listen 443 ssl;
  http2 on;
  server_name ~^(?<subdomain>[^.]+)\.tuinapp\.uk$;

  ssl_certificate     /etc/nginx/ssl/live/tuinapp.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/tuinapp.uk/privkey.pem;
  include             /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  client_max_body_size 64m;

  location / {
    proxy_pass         http://tuinapp_web;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;
  }
}
