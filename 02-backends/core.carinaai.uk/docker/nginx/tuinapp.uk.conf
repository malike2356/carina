# tuinapp.uk - product stack removed from Contabo 2026-09-20
# Redirect to company site / docs. Certs retained for ACME renewals.

server {
  listen 80;
  server_name tuinapp.uk www.tuinapp.uk ~^(?<subdomain>[^.]+)\.tuinapp\.uk$;

  include /etc/nginx/certbot-location.inc;

  location / {
    return 301 https://verlox.uk/;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name tuinapp.uk www.tuinapp.uk ~^(?<subdomain>[^.]+)\.tuinapp\.uk$;

  ssl_certificate     /etc/nginx/ssl/live/tuinapp.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/tuinapp.uk/privkey.pem;
  include             /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  location / {
    return 302 https://verlox.uk/;
  }

  add_header X-Robots-Tag "noindex, nofollow" always;
}
