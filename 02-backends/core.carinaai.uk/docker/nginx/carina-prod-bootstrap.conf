# HTTP-only bootstrap config for first TLS certificate issue.
# Used by docker/scripts/deploy-prod.sh until Let's Encrypt certs exist.

upstream carina_web {
  server carina-web:3000;
}

upstream carina_hub {
  server carina-hub:3001;
}

server {
  listen 80;
  server_name carinaai.uk www.carinaai.uk app.carinaai.uk doc.carinaai.uk docs.carinaai.uk skills.carinaai.uk install.carinaai.uk ops.carinaai.uk;

  include /etc/nginx/certbot-location.inc;

  location /health {
    proxy_pass http://carina_web/health;
    proxy_set_header Host $host;
  }

  location / {
    proxy_pass http://carina_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 80;
  server_name hub.carinaai.uk;

  include /etc/nginx/certbot-location.inc;

  location / {
    proxy_pass http://carina_hub;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
