# keprixai.com on shared Contabo nginx (Carina core)
#
# Marketing origin ONLY for apex + www.
# Product workspace/API lives on app.keprixai.com (see app.keprixai.com.conf).
#
# Canonical path in this workspace:
#   carina/02-backends/core.carinaai.uk/docker/nginx/keprixai.com.conf
# Contabo host (after sync):
#   /home/malike/apps/core.carinaai.uk/docker/nginx/keprixai.com.conf
#
# Do NOT install Keprix Caddy on Contabo :80/:443.
# After reload, always verify https://carinaai.uk/ returns 200.
#
# TLS: Cloudflare Full can use the shared carinaai.uk origin cert (Clinicoms
# style). Switch to a dedicated keprixai.com cert before Cloudflare Full strict.

server {
  listen 80;
  server_name keprixai.com www.keprixai.com;

  include /etc/nginx/certbot-location.inc;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.keprixai.com;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  return 301 https://keprixai.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name keprixai.com;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  client_max_body_size 16m;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  # Docker embedded DNS; variable upstream so nginx boots if FE is down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $keprix_frontend_upstream keprix-frontend:3000;
    proxy_pass http://$keprix_frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}
