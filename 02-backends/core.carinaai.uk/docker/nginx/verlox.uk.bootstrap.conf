# verlox.uk Laravel app via host PHP-FPM socket (aaPanel / Hestia).
# HTTP serves ACME challenges and the app until verlox.uk TLS exists.

server {
  listen 80;
  server_name verlox.uk www.verlox.uk;

  include /etc/nginx/certbot-location.inc;

  root  /www/wwwroot/verlox.uk/public;
  index index.php;

  charset utf-8;
  client_max_body_size 64m;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    fastcgi_pass  unix:/tmp/php-cgi-83.sock;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include       fastcgi_params;
    fastcgi_read_timeout 300;
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }
}
