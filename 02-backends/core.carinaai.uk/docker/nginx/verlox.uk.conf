# verlox.uk Laravel via Docker PHP-FPM (verlox-fpm:9000 on proxy network).
# MySQL is verlox-mysql on the compose network (Laravel DB_HOST=verlox-mysql).
# Migrated off aaPanel host PHP/MySQL 2026-09-20.

server {
  listen 80;
  server_name verlox.uk www.verlox.uk;

  include /etc/nginx/certbot-location.inc;

  return 301 https://verlox.uk$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.verlox.uk;

  ssl_certificate     /etc/nginx/ssl/live/verlox.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/verlox.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  return 301 https://verlox.uk$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name verlox.uk;

  ssl_certificate     /etc/nginx/ssl/live/verlox.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/verlox.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  root  /www/wwwroot/verlox.uk/public;
  index index.php;

  charset utf-8;
  client_max_body_size 64m;
  add_header Strict-Transport-Security "max-age=31536000" always;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; }

  location ~ \.php$ {
    set $verlox_fpm verlox-fpm:9000;
    fastcgi_pass  $verlox_fpm;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    include       fastcgi_params;
    fastcgi_read_timeout 300;
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }

  location ~ /\.(git|env|claude) {
    deny all;
    return 404;
  }

  location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
