# app.keprixai.com on shared Contabo nginx (Carina core)
#
# Keprix product Web UI + API (same-origin /api to backend).
# Marketing apex stays in keprixai.com.conf.
#
# Canonical path:
#   carina/02-backends/core.carinaai.uk/docker/nginx/app.keprixai.com.conf
# Contabo host (after sync):
#   /home/malike/apps/core.carinaai.uk/docker/nginx/app.keprixai.com.conf
#
# Upstream containers (proxy network):
#   keprix-frontend:3000
#   keprix-backend:3333
#
# After reload, always verify https://carinaai.uk/ and https://keprixai.com/.

server {
  listen 80;
  server_name app.keprixai.com;

  include /etc/nginx/certbot-location.inc;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name app.keprixai.com;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  client_max_body_size 32m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  resolver 127.0.0.11 valid=10s ipv6=off;

  # Prefer nginx -> backend for API so the browser stays same-origin on app.
  location /api/ {
    set $keprix_backend_upstream keprix-backend:3333;
    proxy_pass http://$keprix_backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location = /openapi.json {
    set $keprix_backend_upstream keprix-backend:3333;
    proxy_pass http://$keprix_backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /carina/ {
    set $keprix_backend_upstream keprix-backend:3333;
    proxy_pass http://$keprix_backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Product sidecar northbound API (Carina/Aiva/Clinicom packs).
  location /v1/ {
    set $keprix_backend_upstream keprix-backend:3333;
    proxy_pass http://$keprix_backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $keprix_frontend_upstream keprix-frontend:3000;
    proxy_pass http://$keprix_frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
  add_header X-Robots-Tag           "noindex, nofollow";
}
