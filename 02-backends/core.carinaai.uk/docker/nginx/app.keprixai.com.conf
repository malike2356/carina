# app.keprixai.com - marketing-only Contabo posture (2026-09-20)
#
# Workspace API/backend containers are stopped on this VPS to free disk.
# Installs and downloads stay on GitHub; this host only keeps keprixai.com
# marketing (keprix-frontend). Send app traffic to public docs/install.

server {
  listen 80;
  server_name app.keprixai.com;

  include /etc/nginx/certbot-location.inc;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name app.keprixai.com;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  # Workspace offline on Contabo; point operators to marketing docs/install.
  location / {
    return 302 https://keprixai.com/docs;
  }

  add_header X-Robots-Tag "noindex, nofollow" always;
}
