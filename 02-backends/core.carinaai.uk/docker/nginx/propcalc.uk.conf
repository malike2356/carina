server {
  listen 80;
  server_name propcalc.uk www.propcalc.uk;

  include /etc/nginx/certbot-location.inc;

  location / {
    return 301 https://propcalc.uk$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.propcalc.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  return 301 https://propcalc.uk$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name propcalc.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  root /www/wwwroot/propcalc.uk;
  index index.html;

  charset utf-8;

  location ^~ /storage/analytics/ {
    deny all;
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; }

  location ~ \.php$ {
    try_files $uri =404;
    fastcgi_pass unix:/tmp/php-cgi-83.sock;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}
