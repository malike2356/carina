# admin.carinaai.uk - Aiva ops dashboard.
# POST-GTM: IP allowlist off for GTM launch (NGINX_ADMIN_IP_ALLOWLIST=false in docker/config/gtm-rollout.json).
# Resolver lives in conf.d/security-defaults.conf.

server {
  listen 443 ssl;
  http2 on;
  server_name admin.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  include /etc/nginx/conf.d/security-headers.inc;

  client_max_body_size 10M;
  proxy_read_timeout  120s;

  location / {
    set $carina_admin carina-admin:4200;
    proxy_pass         http://$carina_admin;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
  }
}
