# n8n.verlox.uk - workflow automation (n8n container on proxy network)

upstream n8n_app {
  server n8n:5678;
}

server {
  listen 80;
  server_name n8n.verlox.uk;

  include /etc/nginx/certbot-location.inc;

  location / {
    return 301 https://n8n.verlox.uk$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name n8n.verlox.uk;

  ssl_certificate     /etc/nginx/ssl/live/n8n.verlox.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/n8n.verlox.uk/privkey.pem;
  include             /etc/nginx/conf.d/ssl-params.conf;

  client_max_body_size 50m;

  location / {
    proxy_pass         http://n8n_app;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  add_header X-Frame-Options        SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}
