server {
  listen 80;
  server_name search.verlox.uk;

  include /etc/nginx/certbot-location.inc;
  return 301 https://search.verlox.uk$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name search.verlox.uk;

  ssl_certificate     /etc/nginx/ssl/live/verlox.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/verlox.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  client_max_body_size 2m;

  location = /healthz {
    proxy_pass http://searxng-core:8090/healthz;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/search {
    if ($http_authorization != "Bearer 707299c87d97a8351239c6033ba15da908babec70f118666cb7506391ed327e5") {
      add_header WWW-Authenticate 'Bearer realm="search.verlox.uk"' always;
      return 401;
    }

    proxy_pass http://searxng-core:8090/search;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  location / {
    auth_basic "SearXNG";
    auth_basic_user_file /etc/nginx/search.verlox.uk.htpasswd;

    proxy_pass http://searxng-core:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }
}
