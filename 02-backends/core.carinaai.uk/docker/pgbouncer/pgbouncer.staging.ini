[databases]
carina_staging = host=postgres-staging port=5432 dbname=carina_staging user=carina

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = any
pool_mode = transaction
max_client_conn = 100
default_pool_size = 10
reserve_pool_size = 3
reserve_pool_timeout = 5
server_connect_timeout = 15
server_idle_timeout = 600
client_idle_timeout = 300
admin_users = carina
stats_users = carina
ignore_startup_parameters = extra_float_digits
