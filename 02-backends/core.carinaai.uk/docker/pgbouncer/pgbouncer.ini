[databases]
carina = host=postgres port=5432 dbname=carina user=carina
carina_skills_hub = host=postgres port=5432 dbname=carina_skills_hub user=carina
carina_cloud = host=postgres port=5432 dbname=carina_cloud user=carina

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 5
server_connect_timeout = 15
server_idle_timeout = 600
client_idle_timeout = 300
admin_users = carina
stats_users = carina
ignore_startup_parameters = extra_float_digits
