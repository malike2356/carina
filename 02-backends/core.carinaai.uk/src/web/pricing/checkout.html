<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Subscribe to Scout</title>
    <link rel="stylesheet" href="/pricing/pricing.css">
  </head>
  <body>
    <main class="shell">
      <nav class="nav"><a class="brand" href="/pricing">Carina<span style="color: var(--amber)">.</span></a></nav>
      <p class="eyebrow">Checkout</p>
      <h1>Subscribe to Scout</h1>
      <p class="lead">Create your Scout account, then continue to secure payment.</p>
      <form class="form" id="checkout-form">
        <h2 style="font-size: 28px; margin-bottom: 4px;">Create your Scout account</h2>
        <p class="notice" style="margin-top: 0;">Enter your email and choose a password. We will create your account and take you to payment.</p>
        <div class="field">
          <label for="plan">Plan</label>
          <select id="plan" name="plan" disabled>
            <option>Loading plans...</option>
          </select>
        </div>
        <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"></div>
        <button class="btn" type="submit">Continue to payment</button>
        <p class="notice">After payment, you will receive a setup link by email.</p>
        <p class="notice" id="message"></p>
      </form>
    </main>
    <script>
      const SCOUT_CONSOLE = 'https://console.labyrinthscout.com';
      const planAliases = {
        scout_govern: 'scout_pro',
        scout_standard: 'scout_pro',
      };

      function normalizePlanId(value) {
        return planAliases[value] || value || 'scout_pro';
      }

      const params = new URLSearchParams(window.location.search);
      const defaultPlan = normalizePlanId(params.get('plan'));
      const planSelect = document.getElementById('plan');
      const message = document.getElementById('message');

      async function loadPlans() {
        try {
          const res = await fetch('/api/billing/plans');
          if (!res.ok) throw new Error('Unable to load pricing');
          const body = await res.json();
          const plans = (body.plans || []).filter((plan) => plan.id === 'scout_monitor' || plan.id === 'scout_pro');
          if (!plans.length) throw new Error('No Scout plans available');
          planSelect.innerHTML = plans.map((plan) => {
            const price = plan.monthlyPriceGbp == null ? 'Custom' : `£${plan.monthlyPriceGbp}/month`;
            const suffix = plan.highlight ? ` (${String(plan.highlight).toLowerCase()})` : '';
            return `<option value="${plan.id}">${plan.name} - ${price}${suffix}</option>`;
          }).join('');
          planSelect.value = plans.some((plan) => plan.id === defaultPlan) ? defaultPlan : plans[0].id;
        } catch (_err) {
          planSelect.innerHTML = [
            '<option value="scout_monitor">Scout Monitor (visibility)</option>',
            '<option value="scout_pro">Scout Govern (control)</option>',
          ].join('');
          planSelect.value = defaultPlan === 'scout_monitor' ? 'scout_monitor' : 'scout_pro';
        } finally {
          planSelect.disabled = false;
        }
      }

      void loadPlans();

      document.getElementById('checkout-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const selectedPlan = String(form.get('plan') || 'scout_pro');
        message.textContent = 'Creating checkout session...';
        message.style.color = '';
        try {
          const res = await fetch('/api/billing/checkout/session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              plan: selectedPlan,
              email: form.get('email'),
              password: form.get('password'),
              successUrl: `${SCOUT_CONSOLE}/onboard?session={CHECKOUT_SESSION_ID}`,
              cancelUrl: `${window.location.origin}/checkout?plan=${selectedPlan}`,
            }),
          });
          const body = await res.json();
          if (!res.ok) {
            message.textContent = body.error || 'Checkout failed';
            return;
          }
          window.location.href = body.url;
        } catch (_err) {
          message.textContent = 'Something went wrong. Try again or email contact@verlox.uk.';
        }
      });
    </script>
  </body>
</html>
