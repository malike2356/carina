<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carina Platform Status</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 48px 24px;
    }
    .container { max-width: 680px; margin: 0 auto; }
    header { margin-bottom: 40px; }
    h1 { font-size: 1.5rem; font-weight: 600; color: #f8fafc; }
    .sla-badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .overall {
      padding: 20px 24px;
      border-radius: 10px;
      margin-bottom: 32px;
      font-size: 1rem;
      font-weight: 500;
    }
    .overall.all-operational { background: #052e16; border: 1px solid #16a34a; color: #4ade80; }
    .overall.degraded       { background: #431407; border: 1px solid #ea580c; color: #fb923c; }
    .overall.outage         { background: #450a0a; border: 1px solid #dc2626; color: #f87171; }
    .overall.loading        { background: #1e293b; border: 1px solid #334155; color: #94a3b8; }
    .services { list-style: none; }
    .service {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid #1e293b;
    }
    .service:last-child { border-bottom: none; }
    .service-name { font-size: 0.95rem; color: #cbd5e1; }
    .service-right { display: flex; align-items: center; gap: 12px; }
    .uptime { font-size: 0.8rem; color: #64748b; }
    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-label {
      font-size: 0.8rem;
      font-weight: 500;
      min-width: 80px;
      text-align: right;
    }
    .operational .status-dot { background: #22c55e; }
    .operational .status-label { color: #22c55e; }
    .degraded .status-dot { background: #f97316; }
    .degraded .status-label { color: #f97316; }
    .outage .status-dot { background: #ef4444; }
    .outage .status-label { color: #ef4444; }
    footer {
      margin-top: 40px;
      font-size: 0.75rem;
      color: #475569;
    }
    .error-msg { color: #f87171; font-size: 0.85rem; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Carina Platform Status</h1>
      <span class="sla-badge" id="sla-badge">SLA: loading...</span>
    </header>
    <div class="overall loading" id="overall">Checking status...</div>
    <ul class="services" id="services"></ul>
    <footer id="footer"></footer>
  </div>
  <script>
    (function () {
      var overall = document.getElementById('overall');
      var servicesList = document.getElementById('services');
      var footer = document.getElementById('footer');
      var slaBadge = document.getElementById('sla-badge');

      function statusClass(s) {
        if (s === 'operational') return 'operational';
        if (s === 'degraded') return 'degraded';
        return 'outage';
      }

      function statusLabel(s) {
        if (s === 'operational') return 'Operational';
        if (s === 'degraded') return 'Degraded';
        return 'Outage';
      }

      function render(data) {
        var services = data.services || [];
        slaBadge.textContent = 'SLA commitment: ' + (data.sla || '99.9%');

        var allOk = services.every(function (s) { return s.status === 'operational'; });
        var anyOutage = services.some(function (s) { return s.status === 'outage'; });
        var overallStatus = allOk ? 'all-operational' : anyOutage ? 'outage' : 'degraded';
        var overallText = allOk ? 'All systems operational' : anyOutage ? 'Service outage' : 'Degraded performance';

        overall.className = 'overall ' + overallStatus;
        overall.textContent = overallText;

        servicesList.innerHTML = '';
        services.forEach(function (svc) {
          var li = document.createElement('li');
          li.className = 'service';
          var cls = statusClass(svc.status);
          var uptime = typeof svc.uptimePct === 'number' ? svc.uptimePct.toFixed(2) + '% uptime (30d)' : '';
          li.innerHTML =
            '<span class="service-name">' + escHtml(svc.name) + '</span>' +
            '<span class="service-right ' + cls + '">' +
              '<span class="uptime">' + escHtml(uptime) + '</span>' +
              '<span class="status-label">' + escHtml(statusLabel(svc.status)) + '</span>' +
              '<span class="status-dot"></span>' +
            '</span>';
          servicesList.appendChild(li);
        });

        var checkedAt = data.checkedAt ? new Date(data.checkedAt).toLocaleString() : '';
        footer.textContent = checkedAt ? 'Last checked: ' + checkedAt : '';
      }

      function escHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function load() {
        fetch('/api/v1/platform/status')
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(render)
          .catch(function (err) {
            overall.className = 'overall outage';
            overall.textContent = 'Unable to load status';
            footer.textContent = 'Error: ' + err.message;
          });
      }

      load();
      setInterval(load, 60000);
    })();
  </script>
</body>
</html>
