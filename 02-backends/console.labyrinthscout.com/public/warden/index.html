<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WARDEN; Scout Immune System</title>
  <script>
  (function () {
    try {
      var pref = localStorage.getItem('scoutTheme') || 'light';
      if (pref === 'dark') document.documentElement.classList.add('dark');
    } catch (e) {}
  })();
  </script>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --gold: #0f766e;
      --text: #0f172a;
      --muted: #64748b;
      --line: #d7e0ea;
      --crit: #dc2626;
      --high: #ea580c;
      --med: #ca8a04;
      --low: #059669;
    }
    html.dark {
      --bg: #0f141c;
      --panel: #141a24;
      --gold: #d4af37;
      --text: #e8ecf4;
      --muted: #8b93a7;
      --line: #24304d;
      --crit: #e74c3c;
      --high: #e67e22;
      --med: #f1c40f;
      --low: #2ecc71;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Mono", "SF Mono", Consolas, monospace;
      background: radial-gradient(ellipse at top, color-mix(in srgb, var(--gold) 8%, var(--bg)) 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      background: var(--panel);
    }
    h1 { margin: 0; font-size: 1.25rem; color: var(--gold); letter-spacing: 0.08em; }
    .sub { color: var(--muted); font-size: 0.8rem; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: 1rem 1.5rem 2rem; }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1rem;
      min-height: 220px;
    }
    section.wide { grid-column: 1 / -1; }
    h2 { margin: 0 0 0.75rem; font-size: 0.95rem; color: var(--gold); }
    button, .btn {
      background: transparent;
      color: var(--gold);
      border: 1px solid var(--gold);
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      font: inherit;
      text-decoration: none;
      display: inline-block;
    }
    button:hover, .btn:hover { background: color-mix(in srgb, var(--gold) 12%, transparent); }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.75rem; align-items: center; }
    .stat { font-size: 0.85rem; color: var(--muted); }
    .stat strong { color: var(--text); }
    .posture-secure { color: var(--low); }
    .posture-elevated { color: var(--med); }
    .posture-compromised { color: var(--crit); }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    th, td { text-align: left; padding: 0.35rem 0.4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .sev-critical { color: var(--crit); }
    .sev-high { color: var(--high); }
    .sev-medium { color: var(--med); }
    .sev-low { color: var(--low); }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.72rem;
      color: var(--muted);
      max-height: 280px;
      overflow: auto;
      margin: 0;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>WARDEN</h1>
      <div class="sub">Scout defensive immune system</div>
    </div>
    <div class="row" style="margin:0">
      <a class="btn" href="/">Console</a>
      <button id="btnTheme" type="button">Theme</button>
      <button id="btnQuick" type="button">Quick scan</button>
      <button id="btnFull" type="button">Full scan</button>
      <button id="btnRefresh" type="button">Refresh</button>
    </div>
  </header>
  <main>
    <section>
      <h2>Posture</h2>
      <div id="status" class="stat">Loading...</div>
    </section>
    <section>
      <h2>Sensors</h2>
      <div id="sensors" class="stat">Loading...</div>
    </section>
    <section class="wide">
      <h2>Active threats</h2>
      <div id="threats">Loading...</div>
    </section>
    <section class="wide">
      <h2>Event timeline</h2>
      <div id="events">Loading...</div>
    </section>
    <section class="wide">
      <h2>Config</h2>
      <pre id="config">Loading...</pre>
    </section>
  </main>
  <script>
    const API = (window.__WARDEN_API_BASE || '/api/warden');
    const key = localStorage.getItem('scout_api_key') || localStorage.getItem('scoutApiKey') || '';

    function syncThemeBtn() {
      var dark = document.documentElement.classList.contains('dark');
      document.getElementById('btnTheme').textContent = dark ? 'Dark' : 'Light';
    }
    document.getElementById('btnTheme').onclick = function () {
      var dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('scoutTheme', dark ? 'dark' : 'light'); } catch (e) {}
      syncThemeBtn();
    };
    syncThemeBtn();

    async function api(path, opts = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      if (key) headers['X-Scout-Key'] = key;
      const res = await fetch(API + path, Object.assign({}, opts, { headers }));
      if (!res.ok) throw new Error(path + ' -> ' + res.status);
      return res.json();
    }

    function sevClass(s) { return 'sev-' + (s || 'low'); }

    async function refresh() {
      const [status, threats, events, config] = await Promise.all([
        api('/status'),
        api('/threats'),
        api('/events?limit=30'),
        api('/config'),
      ]);

      const postureClass = 'posture-' + (status.posture || 'unknown');
      document.getElementById('status').innerHTML =
        '<div>Posture: <strong class="' + postureClass + '">' + status.posture + '</strong></div>' +
        '<div>Open threats: <strong>' + status.openThreats + '</strong> (critical: ' + status.criticalThreats + ')</div>' +
        '<div>Dry-run: <strong>' + status.dryRun + '</strong> | Enabled: <strong>' + status.enabled + '</strong></div>' +
        '<div>Last scan: <strong>' + (status.lastScanAt || 'n/a') + '</strong></div>';

      document.getElementById('sensors').innerHTML = (status.sensors || []).map(function (s) {
        return '<div>' + s.name + ': ' + (s.enabled ? 'on' : 'off') +
          ' | last signals ' + s.lastSignalCount +
          (s.lastRunAt ? ' @ ' + s.lastRunAt : '') + '</div>';
      }).join('') || 'No sensor data';

      const threatRows = (threats.threats || []).map(function (t) {
        return '<tr><td class="' + sevClass(t.severity) + '">' + t.severity +
          '</td><td>' + t.riskScore + '</td><td>' + t.title +
          '</td><td>' + t.status + '</td><td>' + (t.actions || []).join(', ') + '</td></tr>';
      }).join('');
      document.getElementById('threats').innerHTML = threatRows
        ? '<table><thead><tr><th>Sev</th><th>Risk</th><th>Title</th><th>Status</th><th>Actions</th></tr></thead><tbody>' +
          threatRows + '</tbody></table>'
        : '<div class="stat">No active threats</div>';

      const eventRows = (events.events || []).map(function (e) {
        return '<tr><td class="' + sevClass(e.level) + '">' + e.level +
          '</td><td>' + e.timestamp + '</td><td>' + e.title + '</td></tr>';
      }).join('');
      document.getElementById('events').innerHTML = eventRows
        ? '<table><thead><tr><th>Level</th><th>Time</th><th>Title</th></tr></thead><tbody>' +
          eventRows + '</tbody></table>'
        : '<div class="stat">No events yet</div>';

      document.getElementById('config').textContent = JSON.stringify(config, null, 2);
    }

    document.getElementById('btnRefresh').onclick = function () { refresh().catch(alert); };
    document.getElementById('btnQuick').onclick = function () {
      api('/scan/quick', { method: 'POST', body: '{}' }).then(refresh).catch(alert);
    };
    document.getElementById('btnFull').onclick = function () {
      api('/scan', { method: 'POST', body: JSON.stringify({ mode: 'full' }) }).then(refresh).catch(alert);
    };

    refresh().catch(function (err) {
      document.getElementById('status').textContent = String(err);
    });
    setInterval(function () { refresh().catch(function () {}); }, 15000);
  </script>
</body>
</html>
