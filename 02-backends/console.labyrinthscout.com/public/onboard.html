<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scout setup</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/hub.css?v=5">
  <style>
    .onboard-shell { width: min(640px, 100%); margin: 0 auto; padding: 72px 22px; }
    .onboard-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 32px;
    }
    .onboard-card h1 { margin: 0 0 12px; font-size: 32px; line-height: 1.1; }
    .onboard-card p { color: var(--muted); margin: 0 0 16px; font-size: 16px; line-height: 1.6; }
    .onboard-card .error { color: #f87171; }
    .onboard-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }
  </style>
</head>
<body class="hub-body">
  <main class="onboard-shell">
    <nav class="hub-nav" aria-label="Console navigation">
      <a class="hub-brand" href="/">LABYRINTH SCOUT</a>
      <div class="hub-nav-links">
        <a href="/account/login">Sign in</a>
      </div>
    </nav>

    <section class="onboard-card" id="onboard-panel">
      <h1>Verifying payment</h1>
      <p>Please wait while we confirm your subscription.</p>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session') || params.get('session_id') || '';
    const panel = document.getElementById('onboard-panel');

    function showSuccess() {
      panel.innerHTML = `
        <h1>Your account is ready</h1>
        <p>Check your email for your Scout API key and setup instructions.</p>
        <div class="onboard-actions">
          <a class="hub-btn hub-btn-primary" href="/account/login">Sign in to Scout</a>
          <a class="hub-btn hub-btn-secondary" href="/">Back to home</a>
        </div>
      `;
    }

    function showFailure(message) {
      panel.innerHTML = `
        <h1>Payment verification failed</h1>
        <p class="error">${message}</p>
        <div class="onboard-actions">
          <a class="hub-btn hub-btn-primary" href="/checkout">Try checkout again</a>
          <a class="hub-btn hub-btn-secondary" href="mailto:contact@verlox.uk">Email support</a>
        </div>
      `;
    }

    async function activate() {
      if (!sessionId) {
        showFailure('Missing checkout session. Return to checkout and try again.');
        return;
      }
      try {
        const res = await fetch('/account/activate-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId }),
        });
        const body = await res.json().catch(() => ({}));
        if (res.ok && body.ok) {
          showSuccess();
          return;
        }
        const detail = body.error ? ` ${body.error}` : '';
        showFailure(`We could not verify your payment.${detail} Email contact@verlox.uk with your session ID: ${sessionId}`);
      } catch (_err) {
        showFailure(`We could not verify your payment. Email contact@verlox.uk with your session ID: ${sessionId}`);
      }
    }

    void activate();
  </script>
</body>
</html>
