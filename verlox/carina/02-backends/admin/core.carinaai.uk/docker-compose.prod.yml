services:
  carina-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.carina
    env_file:
      - .env.docker.runtime
    volumes:
      - carina-app-data:/app/data
      - ./docker/logrotate/carina:/etc/logrotate.d/carina:ro
    environment:
      NODE_ENV: production
      HOSTED_MODE: "true"
      WEB_ENABLED: "true"
      DATABASE_URL: postgresql://carina:${DB_PASSWORD:-secret}@postgres:5432/carina
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CARINA_SPLIT_GATEWAY: "false"
      CARINA_SUPERVISOR_HUB: "false"
      CARINA_SUPERVISOR_OPS: "false"
      LABYRINTH_URL: http://labyrinth-scout:4444
      LABYRINTH_LLM_ROUTER_URL: http://carina-web:3000
    healthcheck:
      test: ["CMD", "/usr/local/bin/carina-healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - carina
      - proxy
    restart: unless-stopped

  carina-hub:
    build:
      context: .
      dockerfile: docker/Dockerfile.carina
    command: ["node", "dist/src/skills/hub/server.js"]
    environment:
      NODE_ENV: production
      SKILLS_HUB_PORT: "3001"
      SKILLS_HUB_URL: https://hub.carinaai.uk
      SKILLS_HUB_DATABASE_URL: postgresql://carina:${DB_PASSWORD:-secret}@postgres:5432/carina_skills_hub
      SKILLS_HUB_PUBLISH_KEY: ${SKILLS_HUB_PUBLISH_KEY:-}
      CARINA_SKIP_CONTAINER_BOOTSTRAP: "true"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - carina
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  carina-ops:
    build:
      context: ${CARINA_OPS_CONTEXT:-../../../backends/admin/ops.carinaai.uk}
      dockerfile: ${CARINA_OPS_DOCKERFILE:-docker/Dockerfile.runtime}
    env_file:
      - ${CARINA_OPS_ENV_FILE:-.env.ops.runtime}
    # pid: "host" is required for nsenter to reach host systemd (service restarts)
    pid: "host"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      NODE_ENV: production
      PORT: "4001"
      BIND_HOST: 0.0.0.0
      CARINA_API_URL: http://carina-web:3000
      CARINA_DB_URL: postgresql://carina:${DB_PASSWORD:-secret}@postgres:5432/carina
      SCOUT_CONSOLE_URL: http://labyrinth-scout:4444
      SCOUT_URL: http://labyrinth-scout:4444
      SCOUT_ADMIN_API_URL: http://scout-engine:4455
      SCOUT_ENGINE_URL: http://scout-engine:4455
      # Ops panel path overrides so it does not fall back to host-specific paths.
      # CARINA_CORE_ROOT and SCOUT_CONSOLE_PUBLIC_DIR are only needed for the PTY bridge
      # and Scout static proxy features; if those features are unused, leave them unset.
      CARINA_CORE_ENV_PATH: ${CARINA_CORE_ENV_PATH:-}
      SCOUT_CONSOLE_PUBLIC_DIR: ${SCOUT_CONSOLE_PUBLIC_DIR:-}
      CARINA_WORKSPACE_ROOT: ${CARINA_WORKSPACE_ROOT:-/tmp/carina-workspaces}
    expose:
      - "4001"
    depends_on:
      postgres:
        condition: service_healthy
      carina-web:
        condition: service_healthy
    networks:
      - carina
      - proxy
    restart: unless-stopped

  carina-cloud:
    build:
      context: ${CARINA_CLOUD_CONTEXT:-../../external/client-apps/app.carinaai.uk}
      dockerfile: ${CARINA_CLOUD_DOCKERFILE:-docker/Dockerfile.runtime}
    env_file:
      - ${CARINA_CLOUD_ENV_FILE:-.env.cloud.runtime}
    environment:
      NODE_ENV: production
      PORT: "4100"
      HOSTNAME: "0.0.0.0"
      CARINA_CORE_URL: http://carina-web:3333
      CARINA_USE_CORE_PROXY: "true"
      SKILLS_HUB_INTERNAL_URL: http://carina-hub:3001
    expose:
      - "4100"
    depends_on:
      postgres:
        condition: service_healthy
      carina-web:
        condition: service_healthy
    networks:
      - carina
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF:-./docker/nginx/carina-prod.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/hub.carinaai.uk.conf:/etc/nginx/conf.d/hub.carinaai.uk.conf:ro
      - ./docker/nginx/console.labyrinthscout.com.conf:/etc/nginx/conf.d/console.labyrinthscout.com.conf:ro
      - ./docker/nginx/labyrinthscout.com.conf:/etc/nginx/conf.d/labyrinthscout.com.conf:ro
      - ./docker/nginx/conf.d/certbot-location.inc:/etc/nginx/certbot-location.inc:ro
      - ./docker/nginx/conf.d/ssl-params.conf:/etc/nginx/conf.d/ssl-params.conf:ro
      - ./docs/.vitepress/dist:/var/www/docs:ro
      - ./public_website:/var/www/public_website:ro
      - ${LABYRINTHSCOUT_STATIC:-../../../marketing/sites/labyrinthscout.com}:/var/www/labyrinthscout.com:ro
      - ${CARINA_SSL_DIR:-/etc/carina/ssl}:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - carina-web
      - carina-hub
    networks:
      - carina
      - proxy
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ${CARINA_SSL_DIR:-/etc/carina/ssl}:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    networks:
      - carina
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: carina
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: carina
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carina"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - carina
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - carina
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  certbot-www:
  carina-app-data:

networks:
  carina:
    driver: bridge
  proxy:
    external: true
    name: proxy
