; VERLOX ops panel (ops.carinaai.uk)
; Requires ops.carinaai.uk built into /app/ops.carinaai.uk (see docker-compose.verlox.yml).
; Default autostart=false; set CARINA_SUPERVISOR_OPS=true for all-in-one images.

[program:carina-ops]
command=node /app/ops.carinaai.uk/dist/server.js
directory=/app/ops.carinaai.uk
user=node
autostart=%(ENV_CARINA_SUPERVISOR_OPS)s
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=20
stdout_logfile=/app/data/logs/carina-ops.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/data/logs/carina-ops-err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
environment=NODE_ENV="production",PORT="4000",PATH="%(ENV_PATH)s",HOME="%(ENV_HOME)s"
