; Daily log rotation for /app/data/logs (see docker/logrotate/carina).

[program:logrotate]
command=/bin/sh -c "logrotate -f /etc/logrotate.d/carina 2>/dev/null || true; while sleep 86400; do logrotate -f /etc/logrotate.d/carina 2>/dev/null || true; done"
directory=/app
autostart=true
autorestart=true
startretries=3
priority=100
stdout_logfile=/app/data/logs/logrotate.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/app/data/logs/logrotate-err.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
