; Carina core (full agent: memory, channels, cron, web gateway)
; Started by supervisord inside the Docker image (see Dockerfile.carina).

[program:carina-core]
command=node /app/dist/src/index.js
directory=/app
user=node
autostart=true
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=30
stdout_logfile=/app/data/logs/carina-core.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/app/data/logs/carina-core-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=NODE_ENV="production",WEB_ENABLED="true",WEB_PORT="3000",HOSTED_MODE="true",SKIP_CLI="true",PATH="%(ENV_PATH)s",HOME="%(ENV_HOME)s"
