; VERLOX ops panel (ops.carinaai.uk)
; Copy to /etc/supervisor/conf.d/carina-ops.conf on the VPS, then:
; sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start carina-ops

[program:carina-ops]
command=/usr/bin/node /home/malike/apps/ops.carinaai.uk/dist/server.js
directory=/home/malike/apps/ops.carinaai.uk
user=malike
autostart=true
autorestart=true
startretries=3
startsecs=5
stopwaitsecs=20
stdout_logfile=/home/malike/logs/carina-ops.out.log
stderr_logfile=/home/malike/logs/carina-ops.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
environment=NODE_ENV="production",PORT="4001",CARINA_CORE_ROOT="/home/malike/apps/core.carinaai.uk"
