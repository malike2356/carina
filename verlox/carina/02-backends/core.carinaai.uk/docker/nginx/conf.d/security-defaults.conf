# Shared rate-limit zones (http context via conf.d).
# Docker nginx only. Pair with cloudflare-real-ip.conf when behind Cloudflare.

# Docker embedded DNS for variable proxy_pass (staging/admin upstreams).
resolver 127.0.0.11 valid=30s ipv6=off;

# Sign-in and password reset brute-force protection
limit_req_zone $binary_remote_addr zone=carina_auth:10m rate=30r/m;

# core.carinaai.uk agent API and general backend traffic
limit_req_zone $binary_remote_addr zone=carina_api:10m rate=10r/s;

# app.carinaai.uk / aiva SPA: many parallel reads per navigation
limit_req_zone $binary_remote_addr zone=carina_app_api:10m rate=30r/s;

# Next.js document and asset requests
limit_req_zone $binary_remote_addr zone=carina_global:10m rate=30r/s;

# Optional per-server: include conf.d/security-headers.inc inside location / or server {}
