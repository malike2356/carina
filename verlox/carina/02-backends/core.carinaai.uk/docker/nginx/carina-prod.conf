# docs.carinaai.uk - Docusaurus static docs (build: 03-frontends/marketing/docs.carinaai.uk)
server {
  listen 443 ssl;
  http2 on;
  server_name docs.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  root  /var/www/docs;
  index index.html;

  # Legacy VitePress paths (/docs/...) and bare /user|/developer shortcuts
  location ~ ^/docs/ {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location ~ ^/(user|developer)/ {
    return 301 /docs$request_uri;
  }

  location /assets/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ $uri/index.html /index.html;
  }
}

