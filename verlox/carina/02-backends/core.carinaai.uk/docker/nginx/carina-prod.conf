# ops.carinaai.uk - VERLOX private platform admin
# NOT indexed, NOT linked from any public page. Password-protected at app level.
server {
  listen 443 ssl;
  http2 on;
  server_name ops.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

  proxy_read_timeout  300s;
  proxy_send_timeout  300s;

  # Legacy /business/* bookmarks -> full-page admin at /business-inner/*
  location = /business {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 301 /business-inner/customers$is_args$args;
  }

  location ^~ /business/_next/ {
    proxy_pass         http://carina_ops;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $ops_client_ip;
    proxy_set_header   X-Forwarded-For   $ops_client_ip;
    proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  location ~ ^/business/(.+)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    return 301 /business-inner/$1$is_args$args;
  }

  location / {
    proxy_pass         http://carina_ops;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $ops_client_ip;
    proxy_set_header   X-Forwarded-For   $ops_client_ip;
    proxy_set_header   CF-Connecting-IP  $http_cf_connecting_ip;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_cache        off;
  }
}

