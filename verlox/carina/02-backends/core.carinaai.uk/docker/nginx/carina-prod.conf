# app.carinaai.uk - Carina Cloud workspace (Next.js standalone frontend)
server {
  listen 443 ssl;
  http2 on;
  server_name app.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  include /etc/nginx/conf.d/security-headers.inc;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://core.carinaai.uk; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.stripe.com https://app.carinaai.uk https://admin.hireaiva.co.uk wss://app.carinaai.uk wss://admin.hireaiva.co.uk https://core.carinaai.uk; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none';" always;

  client_max_body_size 10M;
  proxy_read_timeout  300s;
  proxy_send_timeout  300s;

  location = /api/auth/get-session {
    limit_req_status 429;
    proxy_pass         http://carina_cloud;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
  }

  location = /api/auth/sso/resolve {
    limit_req_status 429;
    proxy_pass         http://carina_cloud;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
  }

  location ~ ^/api/auth/(sign-in|sign-up|request-password-reset|reset-password|forget-password) {
    limit_req_status 429;
    proxy_pass         http://carina_cloud;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
  }

  location ~ ^/api/auth/ {
    limit_req_status 429;
    proxy_pass         http://carina_cloud;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
  }

  location /api/webhooks/stripe {
    proxy_pass         http://carina_cloud;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
  }

  location /api/ {
    limit_req_status 429;
    proxy_pass         http://carina_cloud;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
  }

  location = /propreneur-panel.js {
    proxy_pass         http://carina_web/api/aiva/propreneur/panel.js;
    proxy_http_version 1.1;
    proxy_set_header   Host core.carinaai.uk;
    add_header         Cache-Control "no-store";
  }

  # Terminal WebSocket proxy; route directly to ops container PTY bridge.
  # The browser connects to wss://app.carinaai.uk/api/terminal/ws?token=...,
  # and nginx rewrites the path to /ws/tui on the ops container.
  location /api/terminal/ws {
    proxy_pass         http://carina_ops/ws/tui;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering    off;
    proxy_cache        off;
  }

  location ~ ^/aiva/workers/[0-9a-f-]+$ {
    limit_req_status 429;
    proxy_pass         http://carina_cloud;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Accept-Encoding   "";
    proxy_buffering    on;
    sub_filter_once    on;
    sub_filter         '</body>' '<script defer src="/propreneur-panel.js"></script></body>';
  }

  location / {
    limit_req_status 429;
    proxy_pass         http://carina_cloud;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_cache        off;
  }
}

# core.carinaai.uk - Carina Agent API (backend for app.carinaai.uk and operator integrations)
server {
  listen 443 ssl;
  http2 on;
  server_name core.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  include /etc/nginx/conf.d/security-headers.inc;
  include /etc/nginx/conf.d/core-gateway-csp.inc;

  client_max_body_size 20M;
  proxy_read_timeout  300s;
  proxy_send_timeout  300s;

  location /api/webhooks/ {
    proxy_pass         http://carina_web;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
  }

  location /webhooks/stripe {
    proxy_pass         http://carina_web;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_request_buffering off;
  }

  location /api/billing/stripe/webhook {
    proxy_pass         http://carina_web;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_request_buffering off;
  }

  location /api/admin/ {
    deny all;
    return 403;
  }

  location / {
    limit_req_status 429;
    proxy_pass         http://carina_web;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_cache        off;
  }
}

