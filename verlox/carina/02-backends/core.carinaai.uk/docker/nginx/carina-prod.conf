# Docker embedded DNS keeps upstream addresses current after container replacement.
upstream carina_web {
  zone carina_web 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server carina-web:3333 resolve;
}

upstream carina_cloud {
  zone carina_cloud 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server carina-cloud:4100 resolve;
}

upstream carina_hub {
  zone carina_hub 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server carina-hub:3001 resolve;
}

upstream carina_ops {
  zone carina_ops 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server carina-ops:4001 resolve;
}

# Prefer Cloudflare client IP for ops allowlist when proxied through CF.
map $http_cf_connecting_ip $ops_client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}


# Default catchall for unknown hostnames: do not leak into Scout or Carina.
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  return 444;
}

# Verified white-label customer domains are rendered from
# docker/scripts/render-custom-domain-nginx.sh into conf.d/ at deploy time.
# See docker/nginx/carina-cloud-custom-domains.inc.example

# Redirect all HTTP to HTTPS (Carina domains; Scout domains handled in their own conf files)
server {
  listen 80;
server_name carinaai.uk www.carinaai.uk app.carinaai.uk aiva.carinaai.uk core.carinaai.uk api.carinaai.uk admin.carinaai.uk doc.carinaai.uk docs.carinaai.uk skills.carinaai.uk install.carinaai.uk ops.carinaai.uk status.carinaai.uk;

  include /etc/nginx/certbot-location.inc;

  location / {
    return 301 https://$host$request_uri;
  }
}

# carinaai.uk + www - Marketing site
server {
  listen 443 ssl;
  http2 on;
  server_name carinaai.uk www.carinaai.uk;
  set $scout_upstream http://scout-console:4444;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  root  /var/www/public_website;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/subscribe {
    proxy_pass         http://carina_web/api/subscribe;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Trust dashboard (carinaai.uk/trust) - same-origin proxy to Scout public API
  location /api/public/trust {
    proxy_pass         $scout_upstream/api/public/trust;
    proxy_http_version 1.1;
    proxy_set_header   Host              console.labyrinthscout.com;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}

