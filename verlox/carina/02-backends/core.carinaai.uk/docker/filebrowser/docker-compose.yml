services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    volumes:
      - /home/malike:/srv
      - filebrowser_data:/data
    environment:
      - FB_PORT=8080
      - FB_ROOT=/srv
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy

volumes:
  filebrowser_data:
