<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Carina platform brand hierarchy</title>
  <desc id="diagram-desc">Carina is the free MIT kernel at the center. Domain packs and products are built on the kernel. Scout is the optional commercial security layer.</desc>
  <defs>
    <linearGradient id="kernelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a5f7a"/>
      <stop offset="100%" stop-color="#2278a0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="620" fill="#09161e"/>
  <!-- Kernel center -->
  <rect x="250" y="40" width="300" height="72" rx="12" fill="url(#kernelGrad)" stroke="#3498c0" stroke-width="2"/>
  <text x="400" y="68" text-anchor="middle" fill="#ffffff" font-family="Instrument Sans, sans-serif" font-size="18" font-weight="600">Carina</text>
  <text x="400" y="92" text-anchor="middle" fill="#e6f3f8" font-family="Instrument Sans, sans-serif" font-size="13">THE KERNEL - free, MIT</text>
  <!-- Connector lines -->
  <line x1="400" y1="112" x2="400" y2="150" stroke="#1a5f7a" stroke-width="2"/>
  <line x1="150" y1="150" x2="650" y2="150" stroke="#1a5f7a" stroke-width="2"/>
  <line x1="150" y1="150" x2="150" y2="180" stroke="#1a5f7a" stroke-width="2"/>
  <line x1="400" y1="150" x2="400" y2="180" stroke="#1a5f7a" stroke-width="2"/>
  <line x1="650" y1="150" x2="650" y2="180" stroke="#1a5f7a" stroke-width="2"/>
  <!-- Domain packs branch -->
  <rect x="30" y="180" width="240" height="48" rx="8" fill="#0d1f2d" stroke="#1a5f7a" stroke-width="1.5"/>
  <text x="150" y="210" text-anchor="middle" fill="#3498c0" font-family="Instrument Sans, sans-serif" font-size="14" font-weight="600">DOMAIN PACKS (free)</text>
  <rect x="30" y="250" width="110" height="36" rx="6" fill="#142434" stroke="rgba(26,95,122,0.4)" stroke-width="1"/>
  <text x="85" y="272" text-anchor="middle" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="12">property-uk</text>
  <rect x="160" y="250" width="110" height="36" rx="6" fill="#142434" stroke="rgba(26,95,122,0.4)" stroke-width="1"/>
  <text x="215" y="272" text-anchor="middle" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="12">healthcare-uk</text>
  <rect x="30" y="300" width="110" height="36" rx="6" fill="#142434" stroke="rgba(26,95,122,0.4)" stroke-width="1"/>
  <text x="85" y="322" text-anchor="middle" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="12">finance-uk</text>
  <rect x="160" y="300" width="110" height="36" rx="6" fill="#142434" stroke="rgba(26,95,122,0.4)" stroke-width="1"/>
  <text x="215" y="322" text-anchor="middle" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="12">legal-uk</text>
  <!-- Products branch -->
  <rect x="280" y="180" width="240" height="48" rx="8" fill="#0d1f2d" stroke="#1a5f7a" stroke-width="1.5"/>
  <text x="400" y="210" text-anchor="middle" fill="#3498c0" font-family="Instrument Sans, sans-serif" font-size="14" font-weight="600">PRODUCTS</text>
  <rect x="280" y="250" width="110" height="36" rx="6" fill="#142434" stroke="rgba(26,95,122,0.4)" stroke-width="1"/>
  <text x="335" y="272" text-anchor="middle" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="12">Propreneur</text>
  <rect x="410" y="250" width="110" height="36" rx="6" fill="#142434" stroke="rgba(26,95,122,0.4)" stroke-width="1"/>
  <text x="465" y="272" text-anchor="middle" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="12">Flitz</text>
  <rect x="280" y="300" width="110" height="36" rx="6" fill="#142434" stroke="rgba(26,95,122,0.4)" stroke-width="1"/>
  <text x="335" y="322" text-anchor="middle" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="12">COMPASS</text>
  <rect x="410" y="300" width="110" height="36" rx="6" fill="#142434" stroke="rgba(26,95,122,0.4)" stroke-width="1"/>
  <text x="465" y="322" text-anchor="middle" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="12">Carina Ops</text>
  <!-- Scout branch -->
  <rect x="530" y="180" width="240" height="48" rx="8" fill="#0d1f2d" stroke="#f5a623" stroke-width="1.5"/>
  <text x="650" y="210" text-anchor="middle" fill="#f5a623" font-family="Instrument Sans, sans-serif" font-size="14" font-weight="600">SCOUT (commercial)</text>
  <rect x="530" y="250" width="110" height="36" rx="6" fill="#142434" stroke="rgba(245,166,35,0.35)" stroke-width="1"/>
  <text x="585" y="272" text-anchor="middle" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="11">Injection shield</text>
  <rect x="660" y="250" width="110" height="36" rx="6" fill="#142434" stroke="rgba(245,166,35,0.35)" stroke-width="1"/>
  <text x="715" y="272" text-anchor="middle" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="11">Audit logging</text>
  <rect x="530" y="300" width="110" height="36" rx="6" fill="#142434" stroke="rgba(245,166,35,0.35)" stroke-width="1"/>
  <text x="585" y="322" text-anchor="middle" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="11">Kill switch</text>
  <rect x="660" y="300" width="110" height="36" rx="6" fill="#142434" stroke="rgba(245,166,35,0.35)" stroke-width="1"/>
  <text x="715" y="322" text-anchor="middle" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="11">Trust verification</text>
  <!-- Legend -->
  <rect x="200" y="400" width="400" height="180" rx="12" fill="#0d1f2d" stroke="rgba(26,95,122,0.35)" stroke-width="1"/>
  <text x="400" y="430" text-anchor="middle" fill="#ffffff" font-family="Instrument Sans, sans-serif" font-size="14" font-weight="600">One platform. One free kernel.</text>
  <circle cx="240" cy="460" r="6" fill="#1a5f7a"/>
  <text x="260" y="464" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="12">Kernel and domain packs: MIT, free forever</text>
  <circle cx="240" cy="490" r="6" fill="#3498c0"/>
  <text x="260" y="494" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="12">Products: built on Carina (distros)</text>
  <circle cx="240" cy="520" r="6" fill="#f5a623"/>
  <text x="260" y="524" fill="#7a9daf" font-family="Instrument Sans, sans-serif" font-size="12">Scout: optional commercial security layer</text>
  <text x="400" y="560" text-anchor="middle" fill="#3498c0" font-family="Instrument Sans, sans-serif" font-size="11">carinaai.uk/docs/developer/platform-architecture</text>
</svg>
