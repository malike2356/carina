version: 2
updates:
  - package-ecosystem: npm
    directory: /internal/servers/core.carinaai.uk
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      patch-updates:
        update-types:
          - patch

  - package-ecosystem: npm
    directory: /external/client-apps/app.carinaai.uk
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: /internal/servers/console.labyrinthscout.com
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: /external/client-apps/carinaMobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
