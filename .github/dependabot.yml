version: 2
updates:
  - package-ecosystem: npm
    directory: /verlox/carina/02-backends/core.carinaai.uk
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
    groups:
      patch-updates:
        update-types:
          - patch

  - package-ecosystem: npm
    directory: /verlox/carina/03-frontends/client-apps/app.carinaai.uk
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: /verlox/carina/03-frontends/client-apps/carinaMobile
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: /verlox/carina/02-backends/console.labyrinthscout.com
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: /verlox/carina/02-backends/admin/ops.carinaai.uk
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: /verlox/carina/03-frontends/client-apps/admin.carinaai.uk
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: /verlox/carina/02-backends/scout-engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
