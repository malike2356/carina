name: Red Team Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master, develop]

concurrency:
  group: red-team-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  red-team:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/servers/core.carinaai.uk

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d  # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: internal/servers/core.carinaai.uk/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run red team automation tests
        run: node scripts/red-team-check.mjs
