name: Real Behavior Proof

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: behavior-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/servers/core.carinaai.uk

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d  # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: internal/servers/core.carinaai.uk/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run behavior proof checks
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/behavior-proof-check.mjs

      - name: Report failure guidance
        if: failure()
        run: |
          echo "Behavior proof FAILED. Agent-style success claims need tool-backed evidence."
          echo "Check PR description or commit messages for unsupported success statements."
