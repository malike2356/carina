name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      revision:
        description: Full Git SHA to deploy; defaults to the selected branch HEAD
        type: string
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tested revision to VPS
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha || inputs.revision || github.sha }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 0

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.7.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install deploy-time build dependencies
        run: |
          pnpm --dir verlox/carina/02-backends/admin/ops.carinaai.uk install --frozen-lockfile
          pnpm --dir verlox/carina/03-frontends/client-apps/app.carinaai.uk install --frozen-lockfile
          pnpm --dir verlox/carina/03-frontends/client-apps/admin.carinaai.uk install --frozen-lockfile
          pnpm --dir verlox/carina/03-frontends/marketing/docs.carinaai.uk install --frozen-lockfile

      - name: Verify release source
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_REVISION}"
          bash verlox/carina/scripts/deploy-preflight.sh

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy immutable release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          APPS_ROOT: /home/${{ secrets.VPS_USER }}/apps
        run: bash verlox/carina/scripts/deploy-carina.sh

      - name: Verify production revision and critical routes
        run: bash verlox/carina/scripts/verify-release.sh production "${SOURCE_REVISION}"

      - name: Post deploy summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "## Deploy succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Deploy failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Revision: ${SOURCE_REVISION}" >> "$GITHUB_STEP_SUMMARY"
