name: Supply Chain Security

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master, develop]

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/servers/core.carinaai.uk

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: internal/servers/core.carinaai.uk/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate SBOM and scan dependencies
        run: node scripts/supply-chain-check.mjs --fail-on=critical

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa1  # v4.6.2
        with:
          name: sbom
          path: internal/servers/core.carinaai.uk/sbom.spdx.json

      - name: Report failure guidance
        if: failure()
        run: |
          echo "Supply chain security check FAILED."
          echo "Critical dependency vulnerabilities block merge. Review pnpm audit output."
