name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verlox/carina/02-backends/core.carinaai.uk

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d  # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: verlox/carina/02-backends/core.carinaai.uk/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit:security

      - name: Build
        run: pnpm build

      - name: Prune pack dist
        run: node scripts/prune-pack-dist.mjs

      - name: Boundary check
        run: pnpm boundary-check

      - name: Capability inventory check
        run: pnpm capability:check

      - name: Identity smoke tests
        run: pnpm test:identity-smoke

      - name: Run tests with coverage thresholds
        run: pnpm exec vitest run --coverage
        env:
          NODE_ENV: test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-results-linux
          path: verlox/carina/02-backends/core.carinaai.uk/test-results/
          if-no-files-found: ignore

  test-windows:
    name: Test on Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: verlox/carina/02-backends/core.carinaai.uk

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d  # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: verlox/carina/02-backends/core.carinaai.uk/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit:security

      - name: Rebuild native modules for Windows
        run: pnpm rebuild

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test
          FORCE_PLATFORM: win32

      - name: Run shell integration tests (Windows)
        run: pnpm vitest run src/tools/shell-exec.windows.test.ts
        env:
          RUN_SHELL_INTEGRATION: 'true'
          FORCE_PLATFORM: win32

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-results-windows
          path: verlox/carina/02-backends/core.carinaai.uk/test-results/
          if-no-files-found: ignore

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: verlox/carina/02-backends/core.carinaai.uk

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d  # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: verlox/carina/02-backends/core.carinaai.uk/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit:security

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-results-macos
          path: verlox/carina/02-backends/core.carinaai.uk/test-results/
          if-no-files-found: ignore

  release-guards:
    name: Release and workflow guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Critical capability proofs
        run: bash verlox/carina/scripts/verify-release.sh source
      - name: Validate deployment shell
        run: |
          bash -n \
            verlox/carina/scripts/deploy-preflight.sh \
            verlox/carina/scripts/deploy-carina.sh \
            verlox/carina/02-backends/core.carinaai.uk/docker/scripts/deploy-lib.sh \
            verlox/carina/02-backends/core.carinaai.uk/docker/scripts/deploy-atomic.sh \
            verlox/carina/02-backends/core.carinaai.uk/docker/scripts/deploy-prod.sh \
            verlox/carina/02-backends/console.labyrinthscout.com/deploy-atomic.sh
      - name: Validate production compose services
        working-directory: verlox/carina/02-backends/core.carinaai.uk
        env:
          CARINA_WEB_TAG: test
          CARINA_HUB_TAG: test
          CARINA_OPS_TAG: test
          CARINA_CLOUD_TAG: test
          CARINA_ADMIN_TAG: test
        run: |
          services="$(docker compose -f docker-compose.prod.yml -f docker-compose.deploy.yml config --no-interpolate --services)"
          for service in postgres redis pgbouncer carina-web carina-hub carina-ops carina-cloud carina-admin; do
            grep -qx "$service" <<< "$services"
          done
      - name: Validate GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
      - name: Enforce writing style
        run: |
          python3 verlox/scripts/fix-writing-style.py
          git diff --exit-code -- verlox/carina

  ops:
    name: Ops build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verlox/carina/02-backends/admin/ops.carinaai.uk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: verlox/carina/02-backends/admin/ops.carinaai.uk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: docker build -f docker/Dockerfile.runtime -t carina-ops:ci .

  cloud:
    name: Cloud build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verlox/carina/03-frontends/client-apps/app.carinaai.uk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: verlox/carina/03-frontends/client-apps/app.carinaai.uk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  admin:
    name: Admin build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verlox/carina/03-frontends/client-apps/admin.carinaai.uk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: verlox/carina/03-frontends/client-apps/admin.carinaai.uk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verlox/carina/03-frontends/marketing/docs.carinaai.uk
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: verlox/carina/03-frontends/marketing/docs.carinaai.uk/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  mobile:
    name: Mobile typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verlox/carina/03-frontends/client-apps/carinaMobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: verlox/carina/03-frontends/client-apps/carinaMobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  scout-console:
    name: Scout Console build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verlox/carina/02-backends/console.labyrinthscout.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: verlox/carina/02-backends/console.labyrinthscout.com/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  scout-engine:
    name: Scout Engine build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verlox/carina/02-backends/scout-engine
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: verlox/carina/02-backends/scout-engine/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: docker build -t scout-engine:ci .
