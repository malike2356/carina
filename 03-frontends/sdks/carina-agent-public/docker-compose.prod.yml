services:
  carina-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.carina
    environment:
      NODE_ENV: production
      HOSTED_MODE: "true"
      WEB_ENABLED: "true"
      DATABASE_URL: postgresql://carina:${DB_PASSWORD:-secret}@postgres:5432/carina
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - carina
    restart: unless-stopped

  carina-hub:
    build:
      context: .
      dockerfile: docker/Dockerfile.carina
    command: ["node", "dist/src/skills/hub/server.js"]
    environment:
      NODE_ENV: production
      SKILLS_HUB_PORT: "3001"
      SKILLS_HUB_DATABASE_URL: postgresql://carina:${DB_PASSWORD:-secret}@postgres:5432/carina_skills_hub
      SKILLS_HUB_PUBLISH_KEY: ${HUB_PUBLISH_KEY:-change-me-32-char-secret}
      HUB_STRIPE_SECRET_KEY: ${HUB_STRIPE_SECRET_KEY:-}
      HUB_STRIPE_WEBHOOK_SECRET: ${HUB_STRIPE_WEBHOOK_SECRET:-}
      HUB_CHECKOUT_SUCCESS_URL: "https://hub.carinaai.uk/?purchase=success"
      HUB_CHECKOUT_CANCEL_URL: "https://hub.carinaai.uk/?purchase=cancel"
      HUB_PACK_AUTHOR_REVENUE_SHARE_BPS: "7000"
      HUB_PACK_CARINA_REVENUE_SHARE_BPS: "2000"
      HUB_PACK_PLATFORM_FEE_BPS: "1000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - carina
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/carina-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docs/.vitepress/dist:/var/www/docs:ro
      - ./public_website:/var/www/public_website:ro
      - /etc/carina/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - carina-web
      - carina-hub
    networks:
      - carina
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - /etc/carina/ssl:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done"
    networks:
      - carina

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: carina
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: carina
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carina"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - carina

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - carina

volumes:
  pgdata:
  redisdata:
  certbot-www:

networks:
  carina:
    driver: bridge
