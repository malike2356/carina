<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Carina Skills Hub</title>
  <meta name="description" content="Public registry of Carina skill packs and community skills." />
  <link rel="stylesheet" href="/hub.css" />
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div>
        <p class="eyebrow">Carina Community</p>
        <h1>Skills Hub</h1>
        <p class="lede">Browse skill packs and individual skills. Install with <code>carina packs install &lt;name&gt;</code>.</p>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="toolbar">
      <input id="search" type="search" placeholder="Search packs and skills..." autocomplete="off" />
      <select id="category">
        <option value="">All categories</option>
      </select>
      <div class="tabs">
        <button type="button" class="tab active" data-view="packs">Packs</button>
        <button type="button" class="tab" data-view="skills">Skills</button>
      </div>
    </section>

    <section id="packs-view" class="grid"></section>
    <section id="skills-view" class="list hidden"></section>
    <section id="detail" class="detail hidden"></section>
  </main>

  <footer class="wrap foot">
    <p>MIT licensed agent platform by <a href="https://carinaai.uk">VERLOX Ltd</a>. Docs at <a href="https://docs.carinaai.uk">docs.carinaai.uk</a>.</p>
  </footer>

  <script src="/hub.js"></script>
</body>
</html>
