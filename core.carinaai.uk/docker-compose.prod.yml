services:
  carina-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.carina
    volumes:
      - ./.env.runtime:/root/.carina/.env:ro
    # Full stack: @carina/core + @carina/web (see packages/web, Dockerfile.carina)
    environment:
      NODE_ENV: production
      HOSTED_MODE: "true"
      WEB_ENABLED: "true"
      DATABASE_URL: postgresql://carina:${DB_PASSWORD:-secret}@postgres:5432/carina
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/carina-healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - carina
    restart: unless-stopped

  carina-hub:
    build:
      context: .
      dockerfile: docker/Dockerfile.carina
    command: ["node", "dist/src/skills/hub/server.js"]
    environment:
      NODE_ENV: production
      SKILLS_HUB_PORT: "3001"
      SKILLS_HUB_URL: https://hub.carinaai.uk
      SKILLS_HUB_DATABASE_URL: postgresql://carina:${DB_PASSWORD:-secret}@postgres:5432/carina_skills_hub
      SKILLS_HUB_PUBLISH_KEY: ${SKILLS_HUB_PUBLISH_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - carina
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/carina-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/hub.carinaai.uk.conf:/etc/nginx/conf.d/hub.carinaai.uk.conf:ro
      - ./docs/.vitepress/dist:/var/www/docs:ro
      - ./public_website:/var/www/public_website:ro
      - /etc/carina/ssl:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - carina-web
      - carina-hub
    networks:
      - carina
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - /etc/carina/ssl:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h; done"
    networks:
      - carina

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: carina
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: carina
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carina"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - carina

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - carina

volumes:
  pgdata:
  redisdata:
  certbot-www:

networks:
  carina:
    driver: bridge
