; Carina channel gateway (optional split deployment)
;
; Telegram, Discord, Slack, WhatsApp, and other channel adapters run inside
; carina-core by default. Do not start this program alongside carina-core unless
; you operate a deliberate split topology.
;
; Copy to /etc/supervisor/conf.d/carina-gateway.conf on the VPS when needed, then:
; sudo supervisorctl reread && sudo supervisorctl update

[program:carina-gateway]
command=node /home/malike/apps/core.carinaai.uk/dist/src/index.js
directory=/home/malike/apps/core.carinaai.uk
user=malike
autostart=false
autorestart=true
priority=20
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/carina-gateway.out.log
stderr_logfile=/var/log/supervisor/carina-gateway.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=NODE_ENV="production",WEB_ENABLED="false",SKIP_CLI="true"
