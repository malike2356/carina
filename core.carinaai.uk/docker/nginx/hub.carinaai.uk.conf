# Carina Hub public registry (hub.carinaai.uk)
# DNS: A/AAAA record hub.carinaai.uk -> VPS (same as carinaai.uk)
# TLS: certbot certonly --nginx -d hub.carinaai.uk (uses existing carinaai.uk cert if SAN covers it)
# Docker: proxied to carina-hub:3001 via upstream carina_hub in carina-prod.conf

server {
  listen 443 ssl;
  http2 on;
  server_name hub.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include             /etc/nginx/ssl/options-ssl-nginx.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  client_max_body_size 100m;

  location / {
    proxy_pass         http://carina_hub;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}
