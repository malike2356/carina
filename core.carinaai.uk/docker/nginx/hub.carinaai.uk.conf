# hub.carinaai.uk - Skills Hub (supervisor: carina-hub on 127.0.0.1:3001)
# Copy to /etc/nginx/conf.d/hub.carinaai.uk.conf on VPS (uses conf.d, not sites-available).
#
# Obtain TLS cert (once):
#   sudo certbot certonly --nginx -d hub.carinaai.uk
# If carinaai.uk already has a wildcard or multi-SAN cert covering hub.carinaai.uk,
# reuse /etc/letsencrypt/live/carinaai.uk/ as below.

server {
  listen 80;
  server_name hub.carinaai.uk;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name hub.carinaai.uk;

  ssl_certificate     /etc/letsencrypt/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/carinaai.uk/privkey.pem;

  client_max_body_size 100m;

  # Stripe webhooks require the raw request body for signature verification.
  location /api/webhooks/stripe/packs {
    proxy_pass              http://127.0.0.1:3001;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout      60s;
  }

  location / {
    proxy_pass              http://127.0.0.1:3001;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_read_timeout      60s;
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}
