name: Feature request
description: Suggest an improvement to Carina core
title: "[feat]: "
labels: ["enhancement", "help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        For **skill packs**, use the Skill pack proposal template instead.
        For questions, use [GitHub Discussions](https://github.com/malike2356/carina-agent/discussions).
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Gateway / channels
        - Tools
        - Memory / RAG
        - Providers
        - Skills Hub
        - Documentation
        - Other
    validations:
      required: true
