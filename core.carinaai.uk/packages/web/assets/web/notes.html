<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Notes and Tasks; Carina</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface-2: #141720;
    --border: #2a2d3a; --text: #e4e6f0; --muted: #8890a8;
    --accent: #6c8cff; --danger: #ff4d6a; --success: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  .top-nav {
    display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .top-nav a { color: var(--accent); text-decoration: none; font-size: 0.875rem; }
  .layout { flex: 1; display: grid; grid-template-columns: 180px 280px 1fr; min-height: 0; }
  .filters, .list-pane, .editor-pane { min-height: 0; display: flex; flex-direction: column; }
  .filters { border-right: 1px solid var(--border); background: var(--surface-2); padding: 0.75rem; }
  .filter-btn {
    width: 100%; text-align: left; padding: 0.5rem 0.65rem; margin-bottom: 0.35rem;
    border-radius: 8px; border: 1px solid transparent; background: transparent;
    color: var(--text); cursor: pointer; font-size: 0.85rem;
  }
  .filter-btn.active { background: var(--surface); border-color: var(--border); }
  .list-pane { border-right: 1px solid var(--border); background: var(--surface-2); }
  .list-head { padding: 0.75rem; border-bottom: 1px solid var(--border); }
  .list-head button {
    width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 0.45rem 0.6rem; cursor: pointer; font-size: 0.85rem;
  }
  .note-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
  .note-item {
    padding: 0.55rem 0.65rem; border-radius: 8px; cursor: pointer; margin-bottom: 0.25rem;
    border: 1px solid transparent;
  }
  .note-item:hover { background: var(--surface); }
  .note-item.active { background: var(--surface); border-color: var(--border); }
  .note-item.done { opacity: 0.65; }
  .note-title { font-size: 0.84rem; font-weight: 600; display: flex; align-items: center; gap: 0.4rem; }
  .note-meta { font-size: 0.7rem; color: var(--muted); margin-top: 0.15rem; }
  .badge {
    display: inline-block; font-size: 0.62rem; text-transform: uppercase;
    padding: 0.08rem 0.3rem; border-radius: 4px; background: rgba(108,140,255,0.15); color: var(--accent);
  }
  .editor-pane { display: flex; flex-direction: column; min-height: 0; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
    padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .toolbar input, .toolbar select, .toolbar button {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.8rem;
  }
  .toolbar button { cursor: pointer; }
  .toolbar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbar .spacer { flex: 1; }
  #editor {
    flex: 1; width: 100%; resize: none; border: 0; outline: none;
    background: var(--bg); color: var(--text); padding: 0.75rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.85rem; line-height: 1.5;
  }
  .assist-panel {
    border-top: 1px solid var(--border); background: var(--surface); padding: 0.75rem; display: none;
  }
  .assist-panel.open { display: block; }
  .assist-panel textarea {
    width: 100%; min-height: 56px; resize: vertical; margin-top: 0.35rem;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.5rem; font-size: 0.85rem;
  }
  .assist-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
  .assist-actions button {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.4rem 0.65rem; font-size: 0.8rem; cursor: pointer;
  }
  .diff-preview {
    margin-top: 0.6rem; padding: 0.6rem; border-radius: 8px;
    background: var(--surface-2); border: 1px solid var(--border); font-size: 0.82rem;
    white-space: pre-wrap; max-height: 160px; overflow-y: auto;
  }
  .empty-editor {
    flex: 1; display: flex; align-items: center; justify-content: center; color: var(--muted);
  }
  .done-section summary { cursor: pointer; color: var(--muted); font-size: 0.8rem; padding: 0.5rem 0.75rem; }
  .status { font-size: 0.75rem; color: var(--muted); }
  .reminder-due.overdue { color: var(--danger); }
  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
    .filters { flex-direction: row; display: flex; gap: 0.35rem; overflow-x: auto; }
    .filter-btn { width: auto; white-space: nowrap; }
    .list-pane { max-height: 220px; }
  }
</style>
</head>
<body>
<!--CARINA_WORKSPACE_BEGIN-->
<header class="ws-page-header">
  <h1>Notes and Tasks</h1>
  <span class="status" id="save-status"></span>
</header>
<div class="layout">
  <aside class="filters">
    <button type="button" class="filter-btn active" data-filter="all">All</button>
    <button type="button" class="filter-btn" data-filter="note">Notes</button>
    <button type="button" class="filter-btn" data-filter="task">Tasks</button>
    <button type="button" class="filter-btn" data-filter="reminder">Reminders</button>
  </aside>
  <section class="list-pane">
    <div class="list-head">
      <button type="button" id="new-note">+ New</button>
    </div>
    <div class="note-list" id="active-list"></div>
    <details class="done-section" id="done-section" hidden>
      <summary>Done</summary>
      <div class="note-list" id="done-list"></div>
    </details>
  </section>
  <section class="editor-pane" id="editor-pane">
    <div class="empty-editor" id="empty-editor">Select an item or create a new one.</div>
    <div id="editor-panel" hidden>
      <div class="toolbar">
        <input type="text" id="note-title" placeholder="Title" style="min-width:180px;">
        <select id="note-format">
          <option value="note">Note</option>
          <option value="task">Task</option>
          <option value="reminder">Reminder</option>
        </select>
        <input type="datetime-local" id="remind-at" hidden>
        <span class="status" id="reminder-status" hidden></span>
        <button type="button" id="toggle-assist">AI Assist</button>
        <span class="spacer"></span>
        <button type="button" id="save-note" class="primary">Save</button>
        <button type="button" id="delete-note" style="color:var(--danger);">Delete</button>
      </div>
      <textarea id="editor" spellcheck="true"></textarea>
      <div class="assist-panel" id="assist-panel">
        <label for="assist-instruction" style="font-size:0.8rem;color:var(--muted);">Instruction</label>
        <textarea id="assist-instruction" placeholder="e.g. Make this more concise"></textarea>
        <div class="assist-actions">
          <button type="button" id="assist-selection" class="primary">Apply to selection</button>
          <button type="button" id="assist-full">Apply to full note</button>
          <button type="button" id="assist-accept" hidden>Accept</button>
          <button type="button" id="assist-discard" hidden>Discard</button>
        </div>
        <div class="diff-preview" id="assist-preview" hidden></div>
      </div>
    </div>
  </section>
</div>
<!--CARINA_WORKSPACE_END-->
<div id="toast" style="position:fixed;bottom:16px;right:16px;background:var(--surface);border:1px solid var(--border);padding:10px 14px;border-radius:8px;display:none;max-width:320px;font-size:0.85rem;"></div>
<script src="/notes.js"></script>
</body>
</html>
