<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carina Ops - Sessions</title>
  <link rel="stylesheet" href="/ops/assets/ops.css">
</head>
<body>
  <div class="wrap">
    <div class="ops-header"><div><h1>Carina Ops</h1><p class="ops-sub"><span id="org-name">Organization</span></p></div><span class="plan-badge" id="plan-badge"></span></div>
    <nav class="ops-nav" id="ops-nav"></nav>
    <div class="card">
      <h2>Sessions</h2>
      <p style="margin-bottom:12px;">Conversation sessions linked to agents and channels.</p>
      <table class="ops-table">
        <thead><tr><th>Title</th><th>Channel</th><th>Status</th><th>Messages</th><th>Last activity</th></tr></thead>
        <tbody id="sessions-body"><tr><td colspan="5" class="placeholder">Loading...</td></tr></tbody>
      </table>
    </div>
    <div class="card">
      <h2>Open session</h2>
      <form id="session-form">
        <div class="form-row"><label for="session-title">Title</label><input type="text" id="session-title" name="title" placeholder="Support triage"></div>
        <div class="form-row"><label for="session-channel">Channel</label>
          <select id="session-channel" name="channel">
            <option value="workbench">workbench</option>
            <option value="api">api</option>
            <option value="whatsapp">whatsapp</option>
            <option value="web">web</option>
          </select>
        </div>
        <button class="btn" type="submit">Create session</button>
        <p class="error-msg" id="session-error" hidden></p>
      </form>
    </div>
  </div>
  <script src="/ops/assets/layout.js"></script>
  <script src="/ops/assets/platform-page.js"></script>
  <script>
    async function loadSessions() {
      const { ok, data } = await CarinaPlatform.fetchJson('/api/carina-ops/sessions');
      if (!ok) {
        CarinaPlatform.renderTable('sessions-body', [], [], 'Unable to load sessions.');
        return;
      }
      CarinaPlatform.renderTable('sessions-body', [
        { key: 'title' },
        { key: 'channel' },
        { key: 'status' },
        { key: 'messageCount' },
        { key: 'lastActivityAt', render: (row) => row.lastActivityAt ? new Date(row.lastActivityAt).toLocaleString() : '-' },
      ], data.sessions || [], 'No sessions yet.');
    }

    CarinaOpsLayout.initPage('sessions', {
      onReady: async () => {
        await loadSessions();
        CarinaPlatform.bindCreateForm('session-form', async (formData) => {
          CarinaPlatform.showError('session-error', '');
          const { ok, data } = await CarinaPlatform.fetchJson('/api/carina-ops/sessions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: String(formData.get('title') || '').trim() || undefined,
              channel: String(formData.get('channel') || 'workbench'),
            }),
          });
          if (!ok) {
            CarinaPlatform.showError('session-error', data.error || 'Unable to create session.');
            return;
          }
          document.getElementById('session-form').reset();
          await loadSessions();
        });
      },
    });
  </script>
</body>
</html>
