<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>Scheduled Work; Carina</title>
<style>
  .scheduled-wrap { flex: 1; overflow-y: auto; padding: 1rem 1.25rem 2rem; }
  .scheduled-intro {
    font-size: 0.82rem; line-height: 1.55; color: var(--muted);
    padding: 0.75rem 0.9rem; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface-2); margin-bottom: 1rem; max-width: 52rem;
  }
  .status-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 0.55rem; margin-bottom: 1rem; max-width: 52rem;
  }
  .status-card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.65rem 0.75rem;
  }
  .status-card .label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; }
  .status-card .value { font-size: 1.05rem; font-weight: 700; margin-top: 0.15rem; }
  .section { margin-bottom: 1.25rem; max-width: 900px; }
  .section h2 { font-size: 0.88rem; margin-bottom: 0.5rem; }
  .row-item {
    display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center;
    padding: 0.6rem 0.7rem; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); margin-bottom: 0.35rem; font-size: 0.8rem;
  }
  .row-item .title { font-weight: 600; flex: 1; min-width: 140px; }
  .row-item .meta { font-size: 0.72rem; color: var(--muted); }
  .row-item button {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.3rem 0.55rem; font-size: 0.72rem; cursor: pointer;
  }
  .row-item button.primary { background: var(--accent); border-color: var(--accent); color: #0d0d0f; font-weight: 600; }
  .badge {
    display: inline-block; font-size: 0.62rem; text-transform: uppercase;
    padding: 0.08rem 0.35rem; border-radius: 4px; margin-right: 0.25rem;
  }
  .badge.active { background: rgba(25,196,154,0.15); color: var(--accent); }
  .badge.paused { background: rgba(87,87,104,0.2); color: var(--muted); }
  .badge.failed { background: rgba(240,80,80,0.12); color: var(--danger); }
  .empty { color: var(--muted); font-size: 0.82rem; }
</style>
</head>
<body>
<!--CARINA_WORKSPACE_BEGIN-->
<header class="ws-page-header">
  <h1>Scheduled Work</h1>
  <span class="status" id="status"></span>
</header>
<div class="scheduled-wrap">
  <div class="scheduled-intro">
    Cron jobs and TaskFlows run outside chat. Create jobs with <code>carina cron add</code> or
    <code>carina taskflows create</code>; manage them here. Reminders live in
    <a href="/notes" style="color:var(--accent)">Notes</a> and appear on
    <a href="/calendar" style="color:var(--accent)">Calendar</a>.
  </div>
  <div class="status-grid" id="status-grid"></div>
  <section class="section">
    <h2>Cron jobs</h2>
    <div id="cron-list"></div>
  </section>
  <section class="section">
    <h2>TaskFlows</h2>
    <div id="flow-list"></div>
  </section>
  <section class="section">
    <h2>Recent runs</h2>
    <div id="run-list"></div>
  </section>
</div>
<!--CARINA_WORKSPACE_END-->
<script src="/scheduled.js"></script>
</body>
</html>
