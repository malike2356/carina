<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<title>Image Gallery; Carina</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface-2: #141720;
    --border: #2a2d3a; --text: #e4e6f0; --muted: #8890a8;
    --accent: #6c8cff; --danger: #ff4d6a; --success: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  .top-nav {
    display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .top-nav a { color: var(--accent); text-decoration: none; font-size: 0.875rem; }
  .top-nav h1 { font-size: 1rem; font-weight: 600; flex: 1; }
  .status { font-size: 0.75rem; color: var(--muted); }
  .layout { flex: 1; display: grid; grid-template-columns: 1fr 300px; min-height: 0; }
  .gallery-pane { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .gallery-scroll { flex: 1; overflow-y: auto; padding: 1rem; }
  .masonry {
    column-count: 3; column-gap: 0.75rem;
  }
  .thumb-card {
    break-inside: avoid; margin-bottom: 0.75rem; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); overflow: hidden;
    position: relative; cursor: pointer;
  }
  .thumb-card img { width: 100%; display: block; }
  .thumb-overlay {
    position: absolute; inset: 0; background: rgba(15,17,23,0.82);
    opacity: 0; transition: opacity 0.15s; display: flex; flex-direction: column;
    justify-content: flex-end; padding: 0.6rem; gap: 0.4rem;
  }
  .thumb-card:hover .thumb-overlay { opacity: 1; }
  .thumb-prompt {
    font-size: 0.72rem; line-height: 1.35; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .thumb-actions { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .thumb-actions button {
    font-size: 0.68rem; padding: 0.25rem 0.45rem; border-radius: 5px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer;
  }
  .thumb-actions button.danger { color: var(--danger); border-color: rgba(255,77,106,0.4); }
  .empty-state {
    text-align: center; color: var(--muted); padding: 3rem 1rem; font-size: 0.9rem;
  }
  .load-more-wrap { text-align: center; padding: 0.5rem 0 1rem; }
  .load-more-wrap button {
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.45rem 0.9rem; cursor: pointer; font-size: 0.82rem;
  }
  .generate-pane {
    border-left: 1px solid var(--border); background: var(--surface-2);
    display: flex; flex-direction: column; min-height: 0; padding: 0.85rem;
    gap: 0.65rem;
  }
  .generate-pane h2 { font-size: 0.85rem; font-weight: 600; }
  .field label { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 0.25rem; }
  .field textarea, .field select {
    width: 100%; background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.5rem; font-size: 0.82rem;
  }
  .field textarea { min-height: 88px; resize: vertical; }
  .preset-row { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .preset-btn {
    flex: 1; min-width: 80px; font-size: 0.72rem; padding: 0.35rem 0.4rem;
    border-radius: 6px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); cursor: pointer;
  }
  .preset-btn.active { border-color: var(--accent); color: var(--accent); }
  .generate-btn {
    width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 0.55rem; font-size: 0.85rem; cursor: pointer; margin-top: 0.25rem;
  }
  .generate-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .provider-hint { font-size: 0.7rem; color: var(--muted); line-height: 1.4; }
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 100;
    display: none; align-items: center; justify-content: center; padding: 1rem;
  }
  .lightbox.open { display: flex; }
  .lightbox-card {
    max-width: 960px; width: 100%; max-height: 92vh; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    display: grid; grid-template-columns: 1fr 280px; gap: 0;
  }
  .lightbox-img-wrap { background: #000; display: flex; align-items: center; justify-content: center; min-height: 240px; }
  .lightbox-img-wrap img { max-width: 100%; max-height: 70vh; display: block; }
  .lightbox-meta { padding: 0.85rem; display: flex; flex-direction: column; gap: 0.55rem; }
  .lightbox-meta h3 { font-size: 0.82rem; font-weight: 600; }
  .meta-line { font-size: 0.72rem; color: var(--muted); }
  .lightbox-prompt {
    font-size: 0.8rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
    flex: 1; overflow-y: auto;
  }
  .lightbox-actions { display: flex; flex-direction: column; gap: 0.4rem; }
  .lightbox-actions button, .lightbox-close {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.45rem 0.6rem; font-size: 0.78rem; cursor: pointer; text-align: left;
  }
  .lightbox-actions button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lightbox-close { position: absolute; top: 1rem; right: 1rem; z-index: 101; }
  .inpaint-panel {
    display: none; margin-top: 0.5rem; padding: 0.55rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2);
  }
  .inpaint-panel.open { display: block; }
  .inpaint-panel textarea {
    width: 100%; min-height: 52px; margin-top: 0.35rem; resize: vertical;
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 0.45rem; font-size: 0.78rem;
  }
  .toast {
    position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 0.55rem 0.85rem; font-size: 0.82rem; display: none; z-index: 200;
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .generate-pane { border-left: 0; border-top: 1px solid var(--border); }
    .masonry { column-count: 2; }
    .lightbox-card { grid-template-columns: 1fr; }
  }
  @media (max-width: 520px) {
    .masonry { column-count: 1; }
  }
</style>
</head>
<body>
<!--CARINA_WORKSPACE_BEGIN-->
<header class="ws-page-header">
  <h1>Image Gallery</h1>
  <span class="status" id="status"></span>
</header>
<div class="layout">
  <section class="gallery-pane">
    <div class="gallery-scroll">
      <div class="masonry" id="gallery-grid"></div>
      <div class="empty-state" id="empty-state" hidden>No images yet. Generate one from the panel.</div>
      <div class="load-more-wrap" id="load-more-wrap" hidden>
        <button type="button" id="load-more">Load more</button>
      </div>
    </div>
  </section>
  <aside class="generate-pane">
    <h2>Generate</h2>
    <div class="field">
      <label for="prompt-input">Prompt</label>
      <textarea id="prompt-input" placeholder="Describe the image you want..."></textarea>
    </div>
    <div class="field">
      <label for="model-select">Model</label>
      <select id="model-select"></select>
    </div>
    <div class="field">
      <label>Size preset</label>
      <div class="preset-row" id="size-presets">
        <button type="button" class="preset-btn active" data-w="1024" data-h="1024">Square</button>
        <button type="button" class="preset-btn" data-w="768" data-h="1344">Portrait</button>
        <button type="button" class="preset-btn" data-w="1344" data-h="768">Landscape</button>
      </div>
    </div>
    <button type="button" class="generate-btn" id="generate-btn">Generate</button>
    <p class="provider-hint" id="provider-hint"></p>
  </aside>
</div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image detail">
  <button type="button" class="lightbox-close" id="lightbox-close">Close</button>
  <div class="lightbox-card">
    <div class="lightbox-img-wrap">
      <img id="lightbox-img" alt="">
    </div>
    <div class="lightbox-meta">
      <h3>Image details</h3>
      <div class="meta-line" id="lightbox-model"></div>
      <div class="meta-line" id="lightbox-size"></div>
      <div class="meta-line" id="lightbox-date"></div>
      <div class="lightbox-prompt" id="lightbox-prompt"></div>
      <div class="lightbox-actions">
        <button type="button" id="lb-copy-prompt">Copy prompt</button>
        <button type="button" id="lb-use-prompt">Use as prompt</button>
        <button type="button" id="lb-download">Download</button>
        <button type="button" id="lb-inpaint-toggle">Inpaint</button>
        <button type="button" id="lb-remove-bg">Remove background</button>
        <button type="button" id="lb-delete" class="danger" style="color:var(--danger)">Delete</button>
      </div>
      <div class="inpaint-panel" id="inpaint-panel">
        <label for="inpaint-prompt">Inpaint prompt</label>
        <textarea id="inpaint-prompt" placeholder="Describe what to change in the masked area"></textarea>
        <label for="inpaint-mask" style="margin-top:0.4rem;display:block;font-size:0.72rem;color:var(--muted)">Mask image (PNG, white = edit area)</label>
        <input type="file" id="inpaint-mask" accept="image/png">
        <button type="button" class="generate-btn" id="inpaint-submit" style="margin-top:0.5rem">Run inpaint</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<!--CARINA_WORKSPACE_END-->
<script src="/images.js"></script>
</body>
</html>
