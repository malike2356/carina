services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./laravel:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - laravel
      - python-api
    networks:
      - carina

  laravel:
    build:
      context: .
      dockerfile: docker/Dockerfile.laravel
    volumes:
      - ./laravel:/var/www/html
      - laravel-storage:/var/www/html/storage
    env_file: ./laravel/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - carina

  python-api:
    build:
      context: ./python
      dockerfile: Dockerfile
    volumes:
      - ./python:/app
    env_file: ./laravel/.env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - carina

  celery:
    build:
      context: ./python
      dockerfile: Dockerfile
    command: celery -A tasks worker --concurrency=2 --loglevel=info
    volumes:
      - ./python:/app
    env_file: ./laravel/.env
    depends_on:
      - redis
      - postgres
    networks:
      - carina

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: ${DB_USERNAME:-carina}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_DATABASE:-carina_central}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-carina}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - carina

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - carina

  meilisearch:
    image: getmeili/meilisearch:v1.11
    ports:
      - "7701:7700"
    volumes:
      - meilidata:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY:-masterkey}
      MEILI_ENV: development
    networks:
      - carina

volumes:
  pgdata:
  redisdata:
  meilidata:
  laravel-storage:

networks:
  carina:
    driver: bridge
