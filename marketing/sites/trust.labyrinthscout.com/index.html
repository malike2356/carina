<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scout Trust Center; Real-Time Compliance Status</title>
  <meta name="description" content="Scout real-time SOC2 compliance status. Continuous monitoring, cryptographic audit trails, and auditor-ready evidence packages.">
  <meta name="scout-api-base" content="https://console.labyrinthscout.com">
  <style>
    :root { --bg:#070b14; --panel:#10182b; --text:#e8eeff; --muted:#91a0bf; --green:#00c896; --amber:#d4af37; --red:#ff4466; --indigo:#6366f1; --border:#24304d; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--bg); color:var(--text); }
    .wrap { max-width:980px; margin:0 auto; padding:2rem 1.25rem 3rem; }
    header h1 { margin:0; font-size:1.8rem; letter-spacing:.04em; }
    header p { color:var(--muted); margin:.5rem 0 0; }
    .badges { display:flex; flex-wrap:wrap; gap:.6rem; margin:1.5rem 0; }
    .badge { border:1px solid var(--border); border-radius:999px; padding:.35rem .8rem; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; }
    .badge.ready { color:var(--green); border-color:rgba(0,200,150,.45); }
    .badge.partial { color:var(--amber); border-color:rgba(212,175,55,.45); }
    .badge.not-configured { color:var(--red); border-color:rgba(255,68,102,.45); }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.8rem; }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:1rem; }
    .card .label { color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; }
    .card .value { font-size:1.5rem; margin-top:.25rem; font-family:'Courier New',monospace; }
    .controls { margin-top:1.5rem; }
    .controls h2 { font-size:1rem; letter-spacing:.08em; text-transform:uppercase; color:var(--indigo); }
    .control-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:.5rem; margin-top:.75rem; }
    .control { border:1px solid var(--border); border-radius:6px; padding:.55rem .65rem; font-size:.82rem; }
    .control.covered { border-color:rgba(0,200,150,.35); }
    .control.gap { border-color:rgba(212,175,55,.35); }
    .error { color:var(--red); padding:1rem 0; }
    footer { margin-top:2rem; color:var(--muted); font-size:.8rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Scout Trust Center</h1>
      <p>Live compliance posture from Labyrinth Scout. All metrics are API-backed; no static marketing numbers.</p>
    </header>
    <div id="app"><p>Loading compliance data...</p></div>
    <footer>Data refreshes every 5 minutes. Cryptographic anchors: Ethereum mainnet.</footer>
  </div>
  <script>
    function apiBase() {
      var meta = document.querySelector('meta[name="scout-api-base"]');
      return (meta && meta.content) ? meta.content.replace(/\/+$/, '') : '';
    }

    function badgeClass(name) {
      if (name === 'ready') return 'ready';
      if (name === 'partial') return 'partial';
      return 'not-configured';
    }

    function renderTrustCenter(data) {
      var badges = [
        ['SOC2', data.soc2Badge],
        ['ISO 27001', data.iso27001Badge],
        ['GDPR', data.gdprBadge],
      ].map(function (b) {
        return '<span class="badge ' + badgeClass(b[1]) + '">' + b[0] + ': ' + b[1] + '</span>';
      }).join('');

      var controls = (data.controls || []).map(function (c) {
        return '<div class="control ' + (c.covered ? 'covered' : 'gap') + '">' +
          '<strong>' + c.id + '</strong> ' + c.name + '</div>';
      }).join('');

      document.getElementById('app').innerHTML =
        '<div class="badges">' + badges + '</div>' +
        '<div class="grid">' +
        '<div class="card"><div class="label">Monitoring Since</div><div class="value">' + (data.monitoringSince || '-') + '</div></div>' +
        '<div class="card"><div class="label">SOC2 Controls Covered</div><div class="value">' + (data.soc2ControlsCovered || 0) + '/' + (data.soc2ControlsTotal || 0) + '</div></div>' +
        '<div class="card"><div class="label">Critical Findings (90d)</div><div class="value">' + (data.criticalFindings90Days || 0) + '</div></div>' +
        '<div class="card"><div class="label">Anchoring</div><div class="value" style="font-size:1rem">' + (data.cryptographicAnchors || '-') + ' / ' + (data.anchoringFrequency || '-') + '</div></div>' +
        '</div>' +
        '<section class="controls"><h2>Control Coverage</h2><div class="control-grid">' + controls + '</div></section>';
    }

    fetch(apiBase() + '/api/public/compliance/trust-center')
      .then(function (r) { return r.json(); })
      .then(renderTrustCenter)
      .catch(function () {
        document.getElementById('app').innerHTML = '<p class="error">Compliance data temporarily unavailable.</p>';
      });
  </script>
</body>
</html>
