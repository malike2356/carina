# docker-compose.yml; Scout Event Ingestion Server + Redis
# PostgreSQL is shared with Carina (not included here).
# Start with: docker compose up -d
version: '3.8'

services:
  scout-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scout-server
    ports:
      - '${SCOUT_PORT:-4444}:4444'
    environment:
      - SCOUT_PORT=${SCOUT_PORT:-4444}
      - SCOUT_DATABASE_URL=${SCOUT_DATABASE_URL:-postgresql://carina:***@host.docker.internal:5432/carina}
      - REDIS_URL=redis://scout-redis:6379
      - SCOUT_API_KEY=${SCOUT_API_KEY:-change-me-in-production}
    depends_on:
      scout-redis:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  scout-redis:
    image: redis:7-alpine
    container_name: scout-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    volumes:
      - scout-redis-data:/data

volumes:
  scout-redis-data:
