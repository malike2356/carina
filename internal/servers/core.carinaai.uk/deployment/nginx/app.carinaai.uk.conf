# app.carinaai.uk - Carina Cloud Vite SPA + Carina API proxy
# Copy to /etc/nginx/sites-available/app.carinaai.uk.conf and symlink into sites-enabled.
#
# Obtain TLS cert (once):
#   sudo certbot certonly --nginx -d app.carinaai.uk
#
# Static root on VPS: /home/malike/apps/core.carinaai.uk/cloud-dist/

server {
  listen 80;
  server_name app.carinaai.uk;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name app.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include             /etc/nginx/ssl/options-ssl-nginx.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  root /home/malike/apps/core.carinaai.uk/cloud-dist;
  index index.html;

  # Stripe webhook - must not buffer body so signature verification works.
  # Register in Stripe dashboard: https://app.carinaai.uk/api/cloud/stripe/webhook
  # Events: checkout.session.completed, customer.subscription.deleted
  location /api/cloud/stripe/webhook {
    proxy_pass                    http://172.21.0.5:3000;
    proxy_http_version            1.1;
    proxy_set_header              Host              $host;
    proxy_set_header              X-Real-IP         $remote_addr;
    proxy_set_header              X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header              X-Forwarded-Proto $scheme;
    proxy_request_buffering       off;
    proxy_buffering               off;
    proxy_read_timeout            30s;
  }

  location /api/ {
    proxy_pass              http://172.21.0.5:3000;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Upgrade           $http_upgrade;
    proxy_set_header        Connection        "upgrade";
    proxy_buffering         off;
    proxy_read_timeout      300s;
  }

  # Hosted account session endpoints live under /app/auth/*.
  location /app/ {
    proxy_pass              http://172.21.0.5:3000;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto  $scheme;
    proxy_set_header        Upgrade           $http_upgrade;
    proxy_set_header        Connection        "upgrade";
    proxy_buffering         off;
    proxy_read_timeout      300s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
