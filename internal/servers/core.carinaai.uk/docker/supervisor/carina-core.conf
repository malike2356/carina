; Carina core (full agent: memory, channels, cron, web gateway, CLI)
; Copy to /etc/supervisor/conf.d/carina-core.conf on the VPS, then:
; sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start carina-core
;
; Production default: run this service only. Gateway channels and the web UI start
; inside the same Node process. See carina-web.conf for an optional web-only split.
;
; Replace placeholder values below, or rely on /home/malike/apps/core.carinaai.uk/.env
; (Carina loads .env from the app directory in production).

[program:carina-core]
command=node /home/malike/apps/core.carinaai.uk/dist/src/index.js
directory=/home/malike/apps/core.carinaai.uk
user=malike
autostart=true
autorestart=true
priority=10
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/carina-core.out.log
stderr_logfile=/var/log/supervisor/carina-core.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=NODE_ENV="production",WEB_ENABLED="true",WEB_PORT="3000"
