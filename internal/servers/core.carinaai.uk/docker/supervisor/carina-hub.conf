; Skills Hub (hub.carinaai.uk)
; Copy to /etc/supervisor/conf.d/carina-hub.conf on the VPS, then:
; sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start carina-hub
;
; Replace placeholder values below, or rely on /home/malike/apps/core.carinaai.uk/.env
; (Carina loads .env from the app directory in production).

[program:carina-hub]
command=node /home/malike/apps/core.carinaai.uk/dist/src/skills/hub/server.js
directory=/home/malike/apps/core.carinaai.uk
user=malike
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/carina-hub.out.log
stderr_logfile=/var/log/supervisor/carina-hub.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=NODE_ENV="production",SKILLS_HUB_PORT="3001",SKILLS_HUB_DATABASE_URL="postgresql://carina:CHANGE_ME@localhost:5433/carina_skills_hub",SKILLS_HUB_PUBLISH_KEY="CHANGE_ME_32_CHAR_HEX_SECRET",HUB_STRIPE_SECRET_KEY="sk_live_CHANGE_ME",HUB_STRIPE_WEBHOOK_SECRET="whsec_CHANGE_ME",HUB_CHECKOUT_SUCCESS_URL="https://hub.carinaai.uk/?purchase=success",HUB_CHECKOUT_CANCEL_URL="https://hub.carinaai.uk/?purchase=cancel",HUB_PACK_AUTHOR_REVENUE_SHARE_BPS="7000",HUB_PACK_CARINA_REVENUE_SHARE_BPS="2000",HUB_PACK_PLATFORM_FEE_BPS="1000"
