server {
  listen 80;
  server_name labyrinthscout.com www.labyrinthscout.com;

  include /etc/nginx/conf.d/certbot.conf;

  location / {
    return 301 https://labyrinthscout.com$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.labyrinthscout.com;

  ssl_certificate     /etc/nginx/ssl/live/labyrinthscout.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/labyrinthscout.com/privkey.pem;
  include             /etc/nginx/conf.d/ssl-params.conf;

  return 301 https://labyrinthscout.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name labyrinthscout.com;

  ssl_certificate     /etc/nginx/ssl/live/labyrinthscout.com/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/labyrinthscout.com/privkey.pem;
  include             /etc/nginx/conf.d/ssl-params.conf;

  root  /var/www/labyrinthscout.com;
  index index.html;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    allow all;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}
