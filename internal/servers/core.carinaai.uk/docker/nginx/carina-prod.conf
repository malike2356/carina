upstream carina_web {
  server carina-web:3000;
}

upstream carina_cloud {
  server carina-cloud:4100;
}

upstream carina_hub {
  server carina-hub:3001;
}

upstream carina_ops {
  server carina-ops:4001;
}

# Redirect all HTTP to HTTPS (Carina domains; Scout domains handled in their own conf files)
server {
  listen 80;
  server_name carinaai.uk www.carinaai.uk app.carinaai.uk core.carinaai.uk docs.carinaai.uk hub.carinaai.uk skills.carinaai.uk install.carinaai.uk ops.carinaai.uk;

  include /etc/nginx/conf.d/certbot.conf;

  location / {
    return 301 https://$host$request_uri;
  }
}

# carinaai.uk + www - Marketing site
server {
  listen 443 ssl;
  http2 on;
  server_name carinaai.uk www.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  root  /var/www/public_website;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/subscribe {
    proxy_pass         http://carina_web/api/subscribe;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}

# app.carinaai.uk - Carina Cloud workspace (Next.js standalone frontend)
server {
  listen 443 ssl;
  http2 on;
  server_name app.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  proxy_read_timeout  300s;
  proxy_send_timeout  300s;

  location / {
    proxy_pass         http://carina_cloud;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_cache        off;
  }
}

# core.carinaai.uk - Carina Agent API (backend for app.carinaai.uk and operator integrations)
server {
  listen 443 ssl;
  http2 on;
  server_name core.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  proxy_read_timeout  300s;
  proxy_send_timeout  300s;

  location / {
    proxy_pass         http://carina_web;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_cache        off;
  }
}

# skills.carinaai.uk - legacy alias; redirect to hub.carinaai.uk
server {
  listen 443 ssl;
  http2 on;
  server_name skills.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  return 301 https://hub.carinaai.uk$request_uri;
}

# hub.carinaai.uk - see hub.carinaai.uk.conf (loaded from conf.d/)

# docs.carinaai.uk - VitePress static docs
server {
  listen 443 ssl;
  http2 on;
  server_name docs.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  root  /var/www/docs;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# install.carinaai.uk - curl install script
server {
  listen 443 ssl;
  http2 on;
  server_name install.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  root /var/www/install;

  location / {
    default_type text/plain;
    try_files /install.sh =404;
    add_header Content-Disposition 'inline';
  }
}

# ops.carinaai.uk - VERLOX private platform admin
# NOT indexed, NOT linked from any public page. Password-protected at app level.
server {
  listen 443 ssl;
  http2 on;
  server_name ops.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

  proxy_read_timeout  300s;
  proxy_send_timeout  300s;

  location / {
    proxy_pass         http://carina_ops;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_cache        off;
  }
}
