# app.carinaai.uk - Carina Cloud hosted workspace (supervisor: carina-cloud on 127.0.0.1:4100)
# Copy to /etc/nginx/sites-available/app.carinaai.uk.conf and symlink into sites-enabled.
#
# Obtain TLS cert (once):
#   sudo certbot certonly --nginx -d app.carinaai.uk

server {
  listen 80;
  server_name app.carinaai.uk;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name app.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include             /etc/nginx/ssl/options-ssl-nginx.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  client_max_body_size 20m;

  location /api/webhooks/stripe {
    proxy_pass              http://127.0.0.1:4100;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout      60s;
  }

  location / {
    proxy_pass              http://127.0.0.1:4100;
    proxy_http_version      1.1;
    proxy_set_header        Upgrade           $http_upgrade;
    proxy_set_header        Connection        "upgrade";
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_buffering         off;
    proxy_read_timeout      300s;
  }
}
