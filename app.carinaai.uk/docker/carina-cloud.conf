; Carina Cloud (app.carinaai.uk)
; Copy to /etc/supervisor/conf.d/carina-cloud.conf on the VPS, then:
; sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start carina-cloud

[program:carina-cloud]
command=node /home/malike/apps/app.carinaai.uk/server.js
directory=/home/malike/apps/app.carinaai.uk
user=malike
autostart=true
autorestart=true
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/carina-cloud.out.log
stderr_logfile=/var/log/supervisor/carina-cloud.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
environment=NODE_ENV="production",PORT="4100",HOSTNAME="0.0.0.0",DATABASE_URL="postgresql://carina:CHANGE_ME@localhost:5433/carina_cloud",VAULT_SECRET="CHANGE_ME_32_CHAR_MINIMUM_SECRET",BETTER_AUTH_SECRET="CHANGE_ME_AUTH_SECRET",BETTER_AUTH_URL="https://app.carinaai.uk",NEXT_PUBLIC_APP_URL="https://app.carinaai.uk",STRIPE_SECRET_KEY="sk_live_CHANGE_ME",STRIPE_WEBHOOK_SECRET="whsec_CHANGE_ME",STRIPE_PRICE_CARINA_OPS_STARTER="price_CHANGE_ME",STRIPE_PRICE_CARINA_OPS_TEAM="price_CHANGE_ME",CARINA_CORE_URL="http://localhost:3000"
