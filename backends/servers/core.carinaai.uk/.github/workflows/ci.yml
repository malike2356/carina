name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Test on Linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d  # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit:security

      - name: Build
        run: pnpm build

      - name: Prune pack dist
        run: node scripts/prune-pack-dist.mjs

      - name: Boundary check
        run: pnpm boundary-check

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Benchmark regression
        run: pnpm benchmark:regression

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-results-linux
          path: test-results/
          if-no-files-found: ignore

  test-windows:
    name: Test on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d  # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit:security

      - name: Rebuild native modules for Windows
        run: pnpm rebuild

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test
          FORCE_PLATFORM: win32

      - name: Validate Windows packaging
        run: pnpm validate:windows
        env:
          FORCE_PLATFORM: win32

      - name: Run shell integration tests (Windows)
        run: pnpm vitest run src/tools/shell-exec.windows.test.ts
        env:
          RUN_SHELL_INTEGRATION: 'true'
          FORCE_PLATFORM: win32

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-results-windows
          path: test-results/
          if-no-files-found: ignore

  test-macos:
    name: Test on macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d  # v4.1.0
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit:security

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: test-results-macos
          path: test-results/
          if-no-files-found: ignore
