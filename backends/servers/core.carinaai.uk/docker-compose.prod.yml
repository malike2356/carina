services:
  carina-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.carina
    env_file:
      - .env.docker.runtime
    volumes:
      - carina-app-data:/app/data
      - ./docker/logrotate/carina:/etc/logrotate.d/carina:ro
      - ${LABYRINTHSCOUT_STATIC:-../labyrinthscout.com-static}:/var/www/labyrinthscout.com:rw
    environment:
      NODE_ENV: production
      HOSTED_MODE: "true"
      WEB_ENABLED: "true"
      CARINA_OPS_PRODUCT_ENABLED: "true"
      INCIDENT_BLOG_OUTPUT_DIR: /var/www/labyrinthscout.com
      DATABASE_URL: postgresql://carina:${DB_PASSWORD:-secret}@postgres:5432/carina
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CARINA_SPLIT_GATEWAY: "false"
      CARINA_SUPERVISOR_HUB: "false"
      CARINA_SUPERVISOR_OPS: "false"
      LABYRINTH_URL: http://labyrinth-scout:4444
      LABYRINTH_LLM_ROUTER_URL: http://carina-web:3000
      # Pairing secrets (LABYRINTH_API_KEY, instance id/name) come from .env.docker.runtime
      # via sync-docker-env.py. Do not override them here; empty host interpolation blanks env_file.
    healthcheck:
      test: ["CMD", "/usr/local/bin/carina-healthcheck"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - carina
      - proxy
    restart: unless-stopped

  carina-hub:
    build:
      context: .
      dockerfile: docker/Dockerfile.carina
    command: ["node", "dist/src/skills/hub/server.js"]
    environment:
      NODE_ENV: production
      SKILLS_HUB_PORT: "3001"
      SKILLS_HUB_URL: https://hub.carinaai.uk
      SKILLS_HUB_DATABASE_URL: postgresql://carina:${DB_PASSWORD:-secret}@postgres:5432/carina_skills_hub
      SKILLS_HUB_PUBLISH_KEY: ${SKILLS_HUB_PUBLISH_KEY:-}
      CARINA_SKIP_CONTAINER_BOOTSTRAP: "true"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - carina
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  carina-ops:
    build:
      context: ${CARINA_OPS_CONTEXT:-../../admin/ops.carinaai.uk}
      dockerfile: ${CARINA_OPS_DOCKERFILE:-docker/Dockerfile.runtime}
    env_file:
      - ${CARINA_OPS_ENV_FILE:-.env.ops.runtime}
    environment:
      NODE_ENV: production
      PORT: "4001"
      BIND_HOST: 0.0.0.0
      CARINA_API_URL: http://carina-web:3000
      CARINA_OPS_IN_DOCKER: "true"
      # Use postgres (Carina compose service) on the carina network. Do not use scout-postgres.
      CARINA_DB_URL: postgresql://carina:${DB_PASSWORD:-secret}@postgres:5432/carina
      SCOUT_COMPLIANCE_DB_URL: postgresql://scout:${SCOUT_DB_PASSWORD:-secret}@scout-postgres:5432/scout
      SCOUT_CONSOLE_URL: http://scout-console:4444
      SCOUT_URL: http://scout-console:4444
      SCOUT_ADMIN_API_URL: http://scout-engine:4455
      SCOUT_ENGINE_URL: http://scout-engine:4455
      CARINA_CORE_ENV_PATH: ${CARINA_CORE_ENV_PATH:-/run/carina/core.env}
      SCOUT_CONSOLE_PUBLIC_DIR: ${SCOUT_CONSOLE_PUBLIC_DIR:-}
      CARINA_WORKSPACE_ROOT: ${CARINA_WORKSPACE_ROOT:-/tmp/carina-workspaces}
      # Browser TUI (/tui, /ws/tui) spawns carina tui from the mounted host core tree.
      CARINA_CORE_ROOT: /host/core
      CARINA_BIN: /host/core/dist/bin/carina.js
      CARINA_HOME: /run/carina/carina-home
      # Browser terminal PTY runs carina tui inside the carina-web image (not the host mount).
      CARINA_PTY_DOCKER_SERVICE: carina-web
    pid: host
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CARINA_OPS_DOTENV:-../ops.carinaai.uk/.env}:/app/.env:rw
      - ${CARINA_CORE_ENV_MOUNT:-.env.docker.runtime}:/run/carina/core.env:ro
      - ${CARINA_CORE_HOST_MOUNT:-.}:/host/core:ro
      # Host core node_modules is often a symlink into this cache directory.
      - ${CARINA_CORE_RUNTIME_CACHE:-/home/malike/.cache/carina-core-runtime}:/home/malike/.cache/carina-core-runtime:ro
      - ${CARINA_HOME_HOST_MOUNT:-/home/malike/.carina}:/run/carina/carina-home:rw
    expose:
      - "4001"
    depends_on:
      postgres:
        condition: service_healthy
      carina-web:
        condition: service_healthy
    networks:
      - carina
      - proxy
    restart: unless-stopped

  carina-cloud:
    build:
      context: ${CARINA_CLOUD_CONTEXT:-../../external/client-apps/app.carinaai.uk}
      dockerfile: ${CARINA_CLOUD_DOCKERFILE:-docker/Dockerfile.runtime}
    env_file:
      - ${CARINA_CLOUD_ENV_FILE:-.env.cloud.runtime}
    environment:
      NODE_ENV: production
      PORT: "4100"
      HOSTNAME: "0.0.0.0"
      CARINA_CORE_URL: http://carina-web:3000
      CARINA_USE_CORE_PROXY: "true"
      SKILLS_HUB_INTERNAL_URL: http://carina-hub:3001
    expose:
      - "4100"
    depends_on:
      postgres:
        condition: service_healthy
      carina-web:
        condition: service_healthy
    networks:
      - carina
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    group_add:
      - "33"
    entrypoint:
      - /bin/sh
      - -c
      - |
        addgroup -g 33 www-data 2>/dev/null || true
        adduser -D -u 1001 -G www-data -S www 2>/dev/null || true
        sed -i 's/^user .*/user www www-data;/' /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${NGINX_CONF:-./docker/nginx/carina-prod.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/hub.carinaai.uk.conf:/etc/nginx/conf.d/hub.carinaai.uk.conf:ro
      - ./docker/nginx/console.labyrinthscout.com.conf:/etc/nginx/conf.d/console.labyrinthscout.com.conf:ro
      - ./docker/nginx/labyrinthscout.com.conf:/etc/nginx/conf.d/labyrinthscout.com.conf:ro
      - ./docker/nginx/propreneur.uk.conf:/etc/nginx/conf.d/propreneur.uk.conf:ro
      - ./docker/nginx/verlox.uk.conf:/etc/nginx/conf.d/verlox.uk.conf:ro
      - ./docker/nginx/tuinapp.uk.conf:/etc/nginx/conf.d/tuinapp.uk.conf:ro
      - /www/wwwroot/propreneur-v2:/www/wwwroot/propreneur-v2:ro
      - /www/wwwroot/verlox.uk:/www/wwwroot/verlox.uk:ro
      - /www/wwwroot/va.verlox.uk:/www/wwwroot/va.verlox.uk:ro
      - /tmp/php-cgi-83.sock:/tmp/php-cgi-83.sock
      - ./docker/nginx/conf.d/certbot-location.inc:/etc/nginx/certbot-location.inc:ro
      - ./docker/nginx/conf.d/ssl-params.conf:/etc/nginx/conf.d/ssl-params.conf:ro
      - ./docs/.vitepress/dist:/var/www/docs:ro
      - ./public_website:/var/www/public_website:ro
      - ${LABYRINTHSCOUT_STATIC:-../labyrinthscout.com-static}:/var/www/labyrinthscout.com:ro
      - ${CARINA_SSL_DIR:-/etc/letsencrypt}:/etc/nginx/ssl:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - carina-web
      - carina-hub
    networks:
      - carina
      - proxy
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ${CARINA_SSL_DIR:-/etc/letsencrypt}:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"
    networks:
      - carina
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: carina
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: carina
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carina"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      carina:
        aliases:
          - carina-postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - carina
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  certbot-www:
  carina-app-data:

networks:
  carina:
    driver: bridge
  proxy:
    external: true
    name: proxy
