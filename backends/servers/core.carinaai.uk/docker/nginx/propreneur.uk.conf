# Propreneur v2 (propreneur.uk) served via Docker nginx + Dockerized PHP-FPM.
# nginx reaches PHP-FPM via the shared "proxy" Docker network at propreneur-fpm:9000.
# No socket bind mounts required.

# HTTP: apex + www -> HTTPS apex
server {
    listen 80;
    server_name propreneur.uk www.propreneur.uk;

    include /etc/nginx/certbot-location.inc;

    return 301 https://propreneur.uk$request_uri;
}

# HTTPS: www -> apex
server {
    listen 443 ssl;
    http2 on;
    server_name www.propreneur.uk;

    ssl_certificate     /etc/nginx/ssl/live/propreneur.uk/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/propreneur.uk/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;
    ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

    return 301 https://propreneur.uk$request_uri;
}

# HTTPS: central app (platform, register, /platform/login)
server {
    listen 443 ssl;
    http2 on;
    server_name propreneur.uk;

    ssl_certificate     /etc/nginx/ssl/live/propreneur.uk/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/propreneur.uk/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;
    ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

    root  /www/wwwroot/propreneur-v2/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass  propreneur-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include       fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ /\.(git|env|claude) {
        deny all;
        return 404;
    }
}

# HTTP: tenant workspaces (*.propreneur.uk)
server {
    listen 80;
    server_name ~^(?<subdomain>[^.]+)\.propreneur\.uk$;

    include /etc/nginx/certbot-location.inc;

