upstream carina_web {
  server carina-web:3000;
}

upstream carina_cloud {
  server carina-cloud:4100;
}

upstream carina_hub {
  server carina-hub:3001;
}

upstream carina_ops {
  server carina-ops:4001;
}


# Default catchall for unknown hostnames: do not leak into Scout or Carina.
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  return 444;
}

# Verified white-label customer domains are rendered from
# docker/scripts/render-custom-domain-nginx.sh into conf.d/ at deploy time.
# See docker/nginx/carina-cloud-custom-domains.inc.example

# Redirect all HTTP to HTTPS (Carina domains; Scout domains handled in their own conf files)
server {
  listen 80;
server_name carinaai.uk www.carinaai.uk app.carinaai.uk core.carinaai.uk doc.carinaai.uk docs.carinaai.uk skills.carinaai.uk install.carinaai.uk ops.carinaai.uk;

  include /etc/nginx/certbot-location.inc;

  location / {
    return 301 https://$host$request_uri;
  }
}

# carinaai.uk + www - Marketing site
server {
  listen 443 ssl;
  http2 on;
  server_name carinaai.uk www.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  root  /var/www/public_website;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/subscribe {
    proxy_pass         http://carina_web/api/subscribe;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # Trust dashboard (carinaai.uk/trust) - same-origin proxy to Scout public API
  location /api/public/trust {
    proxy_pass         http://labyrinth_scout/api/public/trust;
    proxy_http_version 1.1;
    proxy_set_header   Host              console.labyrinthscout.com;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}

# app.carinaai.uk - Carina Cloud workspace (Next.js standalone frontend)
server {
  listen 443 ssl;
  http2 on;
  server_name app.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  proxy_read_timeout  300s;
  proxy_send_timeout  300s;

  # Terminal WebSocket proxy; route directly to ops container PTY bridge.
  # The browser connects to wss://app.carinaai.uk/api/terminal/ws?token=...,
  # and nginx rewrites the path to /ws/tui on the ops container.
  location /api/terminal/ws {
    proxy_pass         http://carina_ops/ws/tui;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering    off;
    proxy_cache        off;
  }

  location / {
    proxy_pass         http://carina_cloud;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_cache        off;
  }
}

# core.carinaai.uk - Carina Agent API (backend for app.carinaai.uk and operator integrations)
server {
  listen 443 ssl;
  http2 on;
  server_name core.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  proxy_read_timeout  300s;
  proxy_send_timeout  300s;

  location / {
    proxy_pass         http://carina_web;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_cache        off;
  }
}

