# install.carinaai.uk - curl install script
server {
  listen 443 ssl;
  http2 on;
  server_name install.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  root /var/www/install;

  location / {
    default_type text/plain;
    try_files /install.sh =404;
    add_header Content-Disposition 'inline';
  }
}

# ops.carinaai.uk - VERLOX private platform admin
# NOT indexed, NOT linked from any public page. Password-protected at app level.
server {
  listen 443 ssl;
  http2 on;
  server_name ops.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

  proxy_read_timeout  300s;
  proxy_send_timeout  300s;

  location / {
    proxy_pass         http://carina_ops;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        "upgrade";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_buffering    off;
    proxy_cache        off;
  }
}

# va.verlox.uk - VERLOX Virtual Assistant (bare-metal PHP via host socket)
server {
  listen 80;
  server_name va.verlox.uk www.va.verlox.uk;

  include /etc/nginx/certbot-location.inc;

  location / {
    return 301 https://va.verlox.uk$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.va.verlox.uk;

  ssl_certificate     /etc/nginx/ssl/live/va.verlox.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/va.verlox.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  return 301 https://va.verlox.uk$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name va.verlox.uk;

  ssl_certificate     /etc/nginx/ssl/live/va.verlox.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/va.verlox.uk/privkey.pem;
  include /etc/nginx/conf.d/ssl-params.conf;
  ssl_dhparam         /etc/nginx/ssl/ssl-dhparams.pem;

  root /www/wwwroot/va.verlox.uk;
  index index.php;

  charset utf-8;
  client_max_body_size 64m;
  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt  { access_log off; log_not_found off; }

  location ~ \.php$ {
    fastcgi_pass  unix:/tmp/php-cgi-83.sock;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include       fastcgi_params;
    fastcgi_read_timeout 300;
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }

  location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
