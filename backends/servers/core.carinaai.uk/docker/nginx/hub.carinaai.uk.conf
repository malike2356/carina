# hub.carinaai.uk - Skills Hub (Docker prod: carina-hub service on 3001)

server {
  listen 80;
  server_name hub.carinaai.uk;

  include /etc/nginx/certbot-location.inc;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name hub.carinaai.uk;

  ssl_certificate     /etc/nginx/ssl/live/carinaai.uk/fullchain.pem;
  ssl_certificate_key /etc/nginx/ssl/live/carinaai.uk/privkey.pem;
  include             /etc/nginx/conf.d/ssl-params.conf;

  client_max_body_size 100m;

  location /api/webhooks/stripe/packs {
    proxy_pass              http://carina-hub:3001;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout      60s;
  }

  location / {
    proxy_pass              http://carina-hub:3001;
    proxy_http_version      1.1;
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_read_timeout      60s;
  }

  add_header X-Frame-Options        DENY;
  add_header X-Content-Type-Options nosniff;
  add_header Referrer-Policy        no-referrer-when-downgrade;
}
