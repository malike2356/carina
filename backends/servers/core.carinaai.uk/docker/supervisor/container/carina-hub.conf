; Skills Hub (hub.carinaai.uk)
; Default prod compose runs hub as a separate container. Enable with CARINA_SUPERVISOR_HUB=true.

[program:carina-hub]
command=node /app/dist/src/skills/hub/server.js
directory=/app
user=node
autostart=%(ENV_CARINA_SUPERVISOR_HUB)s
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=30
stdout_logfile=/app/data/logs/carina-hub.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/app/data/logs/carina-hub-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=NODE_ENV="production",SKILLS_HUB_PORT="3001"
