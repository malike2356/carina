; Optional split: channel gateway without the web UI.
; Leave autostart=false unless CARINA_SPLIT_GATEWAY=true on the container.

[program:carina-gateway]
command=node /app/dist/src/index.js
directory=/app
user=node
autostart=%(ENV_CARINA_SPLIT_GATEWAY)s
autorestart=true
startretries=5
startsecs=3
stopwaitsecs=30
stdout_logfile=/app/data/logs/carina-gateway.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/app/data/logs/carina-gateway-err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=NODE_ENV="production",WEB_ENABLED="false",SKIP_CLI="true"
