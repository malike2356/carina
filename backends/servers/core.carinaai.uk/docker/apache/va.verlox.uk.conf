# Bind on loopback so Docker edge nginx can proxy via host.docker.internal:8080.
<VirtualHost 127.0.0.1:8080>
    ServerName va.verlox.uk
    ServerAlias www.va.verlox.uk
    ServerAdmin webmaster@example.com
    DocumentRoot "/www/wwwroot/va.verlox.uk"
    ErrorLog "/var/log/apache2/domains/va.verlox.uk-error_log"
    CustomLog "/var/log/apache2/domains/va.verlox.uk-access_log" combined

    <Files ~ (\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)$>
        Order allow,deny
        Deny from all
    </Files>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/www.sock|fcgi://localhost"
    </FilesMatch>

    <Directory "/www/wwwroot/va.verlox.uk">
        SetOutputFilter DEFLATE
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html index.htm default.php default.html default.htm
    </Directory>
</VirtualHost>
