<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scout Auditor View</title>
  <style>
    :root { --bg:#0b1020; --panel:#141b2f; --text:#dbe4ff; --muted:#8b9bb8; --green:#00c896; --amber:#d4af37; --red:#ff4466; --border:#24304d; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:'Courier New',monospace; background:var(--bg); color:var(--text); }
    .wrap { max-width:900px; margin:2rem auto; padding:0 1rem; }
    h1 { font-size:1.1rem; letter-spacing:.12em; text-transform:uppercase; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:6px; padding:1rem; margin-top:1rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:.75rem; }
    .metric .label { color:var(--muted); font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; }
    .metric .value { font-size:1.4rem; margin-top:.2rem; }
    table { width:100%; border-collapse:collapse; margin-top:1rem; font-size:.85rem; }
    th,td { border-bottom:1px solid var(--border); padding:.45rem .35rem; text-align:left; }
    .ok { color:var(--green); }
    .gap { color:var(--amber); }
    .error { color:var(--red); padding:1rem 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Scout SOC2 Auditor View</h1>
    <div id="app"><div class="panel">Loading compliance data...</div></div>
  </div>
  <script>
    function tokenFromPath() {
      var parts = location.pathname.split('/').filter(Boolean);
      return parts[parts.length - 1] || '';
    }

    function render(data) {
      var covered = data.coveredControls || 0;
      var total = data.totalControls || 0;
      var pct = data.coveragePercent || 0;
      var rows = (data.controls || []).map(function (c) {
        return '<tr><td>' + c.controlId + '</td><td>' + c.name + '</td><td>' +
          (c.covered ? '<span class="ok">covered</span>' : '<span class="gap">gap</span>') + '</td><td>' +
          (c.evidenceCount || 0) + '</td><td>' + (c.lastEvidenceAt || '-') + '</td></tr>';
      }).join('');

      document.getElementById('app').innerHTML =
        '<div class="panel"><div class="grid">' +
        '<div class="metric"><div class="label">Organization</div><div class="value">' + (data.organizationName || '-') + '</div></div>' +
        '<div class="metric"><div class="label">Coverage</div><div class="value">' + covered + '/' + total + ' (' + pct + '%)</div></div>' +
        '<div class="metric"><div class="label">Evidence Items</div><div class="value">' + (data.evidenceCount || 0) + '</div></div>' +
        '<div class="metric"><div class="label">Report Date</div><div class="value" style="font-size:.95rem">' + (data.reportDate || '-') + '</div></div>' +
        '</div><table><thead><tr><th>Control</th><th>Name</th><th>Status</th><th>Evidence</th><th>Last Evidence</th></tr></thead><tbody>' +
        rows + '</tbody></table></div>';
    }

    var token = tokenFromPath();
    if (!token) {
      document.getElementById('app').innerHTML = '<div class="error">Missing auditor token.</div>';
    } else {
      fetch('/api/public/compliance/auditor/' + encodeURIComponent(token))
        .then(function (r) { if (!r.ok) throw new Error('invalid'); return r.json(); })
        .then(render)
        .catch(function () {
          document.getElementById('app').innerHTML = '<div class="error">Invalid or expired auditor link.</div>';
        });
    }
  </script>
</body>
</html>
