services:
  labyrinth-scout:
    build:
      context: .
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        RUN corepack enable && corepack prepare pnpm@latest --activate
        COPY package.json pnpm-lock.yaml ./
        RUN pnpm install --frozen-lockfile
        COPY . .
        RUN pnpm build
        CMD ["node", "dist/server.js"]
    ports:
      - "${SCOUT_PORT:-3001}:${SCOUT_PORT:-3001}"
    environment:
      NODE_ENV: production
      SCOUT_PORT: ${SCOUT_PORT:-3001}
      SCOUT_DATABASE_URL: postgresql://scout:${SCOUT_DB_PASSWORD:-secret}@postgres:5432/scout
      REDIS_URL: redis://redis:6379
      SCOUT_LICENSE_KEY: ${SCOUT_LICENSE_KEY:-}
      SCOUT_API_KEY: ${SCOUT_API_KEY:-}
      SCOUT_SESSION_SECRET: ${SCOUT_SESSION_SECRET:-}
      SCOUT_PROXY_ENABLED: ${SCOUT_PROXY_ENABLED:-false}
      SCOUT_PROXY_PORT: ${SCOUT_PROXY_PORT:-8080}
      SCOUT_PROXY_KEY: ${SCOUT_PROXY_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scout
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${SCOUT_DB_PASSWORD:-secret}
      POSTGRES_DB: scout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - scout

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - scout

volumes:
  pgdata:
  redisdata:

networks:
  scout:
    driver: bridge
